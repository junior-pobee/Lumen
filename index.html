<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a13">
<meta name="description" content="Lumen — search, research, discover images, and build with code.">
<meta name="application-name" content="Lumen">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#080a13">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" sizes="512×512" href="./icons/icon-512.png">
<title>Lumen — Search, Research & Code</title>
<style>
:root{color-scheme:dark;--bg:#06070d;--ink:#f8f9ff;--muted:#a0aac1;--line:#ffffff19;--accent:#9acbff;--glass:#ffffff09;--radius:22px}
*{box-sizing:border-box;margin:0}
html{width:100%;height:100%;overflow:hidden}
body{width:100%;height:100vh;height:100dvh;min-height:0;overflow:hidden;display:flex;background:var(--bg);color:var(--ink);font:15px/1.6 Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.orb{position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(100px);opacity:.35}
.orb1{width:48vw;height:48vw;top:-20vw;left:-20vw;background:#1648d2}
.orb2{width:42vw;height:42vw;right:-20vw;bottom:-20vw;background:#7025bc}
.orb3{width:30vw;height:30vw;left:30%;top:35%;background:#087e9b;opacity:.18}

/* ===== Lumen Loading Screen Overlay ===== */
#lumen-loading-screen{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#06070d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:opacity 0.6s ease, visibility 0.6s ease;
  padding:20px;
}
#lumen-loading-screen.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.ls-logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:.3em;
  color:#fff;
  margin-bottom:24px;
}
.ls-logo span{color:var(--accent)}
.ls-spinner-container{
  position:relative;
  width:80px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:28px;
}
.ls-spinner-ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:3px solid transparent;
  border-top-color:var(--accent);
  border-right-color:rgba(154,203,255,0.3);
  animation:ls-spin 1.2s linear infinite;
}
.ls-spinner-core{
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 20px var(--accent);
  animation:ls-pulse 1.8s ease-in-out infinite alternate;
}
.ls-progress-bar-bg{
  width:100%;
  max-width:260px;
  height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:999px;
  overflow:hidden;
  margin-bottom:12px;
}
.ls-progress-bar-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#1648d2,var(--accent));
  border-radius:999px;
  transition:width 0.1s linear;
}
.ls-status-text{
  font-size:12px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
  height:18px;
}
.ls-credit{
  margin-top:20px;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#70809b;
  font-weight:600;
  opacity:0.85;
}
@keyframes ls-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes ls-pulse{0%{transform:scale(0.7);opacity:0.5}100%{transform:scale(1.1);opacity:1}}

nav{width:250px;flex:0 0 250px;min-height:0;min-width:0;margin:14px;padding:22px 13px;border:1px solid var(--line);border-radius:var(--radius);background:#0c1124e8;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;gap:7px;overflow-y:auto;overscroll-behavior:contain}
.logo{padding:0 12px 24px;font-size:23px;font-weight:900;letter-spacing:.3em;flex-shrink:0}
.logo span{color:var(--accent)}
nav button{border:1px solid transparent;border-radius:14px;padding:12px;background:transparent;color:var(--muted);font-weight:700;text-align:left;display:flex;align-items:center;gap:12px}
nav button:hover,nav button.on{background:#ffffff10;border-color:var(--line);color:#fff}
.navbottom{margin-top:auto;display:grid;gap:7px;padding-top:14px}
main{position:relative;flex:1 1 0;min-width:0;min-height:0;height:100%;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:30px clamp(14px,4vw,54px) 60px}
.wrap{width:100%;max-width:1100px;min-height:0;margin:0 auto}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:900;text-transform:uppercase}
.status{font-size:12px;color:var(--muted)}
h1{font-size:clamp(32px,5vw,58px);line-height:1.08;letter-spacing:-.045em;font-weight:900;overflow-wrap:anywhere}
h2{font-size:23px;line-height:1.25;margin-bottom:12px;overflow-wrap:anywhere}
h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin:20px 0 10px}
p{overflow-wrap:anywhere}
.sub{color:var(--muted);margin:13px 0 23px;max-width:760px}
.panel{min-width:0;border:1px solid var(--line);background:var(--glass);border-radius:var(--radius);padding:22px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:inset 0 1px #ffffff0b,0 20px 65px -35px #000;margin-bottom:16px;animation:appear .25s ease both}
@keyframes appear{from{opacity:0;transform:translateY(7px)}}
.searchbar{display:flex;align-items:center;gap:8px;min-width:0;padding:7px 8px 7px 18px;border:1px solid var(--line);border-radius:999px;background:#080a13dc;box-shadow:0 0 45px -25px var(--accent)}
.searchbar:focus-within{border-color:var(--accent)}
.searchbar input{min-width:0;flex:1;background:none;border:0;outline:none;padding:10px 0;font-size:16px}
.primary,.secondary,.chip,.tab{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-weight:800;text-decoration:none;transition:background .2s,border-color .2s}
.primary{border:0;background:#fff;color:#090b13;padding:12px 21px}
.primary:hover{background:#dcecff}
.secondary,.chip,.tab{background:#ffffff0b;color:var(--muted)}
.tabs .tab{background:#c0c0c0;border-color:#e5e5e5;color:#111;transition:background .35s,color .35s,border-color .35s}
.tabs .tab:hover{background:#d4d4d4}
.tabs .tab.on{background:#000;border-color:#fff;color:#fff;animation:tabtoblack .4s ease-out}
@keyframes tabtoblack{from{background:#c0c0c0;color:#111;border-color:#e5e5e5}to{background:#000;color:#fff;border-color:#fff}}
.panel.empty{background:#f97316;border-color:#fdba74;color:#fff}
.panel.empty h2{color:#fff;font-weight:900;font-size:27px;text-shadow:0 2px 10px #00000066}
.panel.empty p{color:#fff;font-weight:600;text-shadow:0 1px 6px #00000055}
.panel.empty div{color:#fff;text-shadow:0 2px 10px #00000066}
.secondary:hover,.chip:hover,.tab:hover,.tab.on{color:#fff;border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.suggestions .chip{font-size:12px;padding:5px 10px;border-radius:0}
.tabs{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;padding:7px 1px 17px;margin-bottom:8px}
.tab{flex-shrink:0;white-space:nowrap;font-size:13px}
.tab.on{background:#8fc3ff20;color:var(--accent)}
.word{font-size:clamp(25px,4vw,40px);font-weight:900;line-height:1.15;letter-spacing:-.03em;overflow-wrap:anywhere}
.answer{margin-top:17px;color:#e1e6f1;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-size:15px}
.muted{color:var(--muted)}
.hero{display:block;width:100%;max-height:370px;object-fit:cover;border-radius:16px;margin:0 0 18px;background:#111522}
.image-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:18px 0}
.image-preview a{min-width:0;display:block}
.image-preview img{display:block;width:100%;height:145px;object-fit:cover;border-radius:13px;border:1px solid var(--line);background:#111522}
.image-preview a:hover img{border-color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(155px,100%),1fr));gap:13px}
.gallery a{display:block;min-width:0;color:var(--muted);text-decoration:none;font-size:12px;overflow-wrap:anywhere}
.gallery img{display:block;width:100%;height:170px;object-fit:cover;border-radius:13px;border:1px solid var(--line);background:#111522}
.gallery a:hover img{border-color:var(--accent)}
.result{display:flex;gap:13px;min-width:0;padding:14px 0;border-bottom:1px solid var(--line)}
.result:last-child{border-bottom:0}
.result>div{min-width:0;flex:1}
.result img{width:94px;height:82px;object-fit:cover;border-radius:12px;flex-shrink:0}
.result a,.link{color:var(--accent);text-decoration:none;font-weight:800;overflow-wrap:anywhere}
.result a:hover,.link:hover{text-decoration:underline}
.result p{font-size:13px;color:var(--muted);margin-top:5px}
.empty{text-align:center;padding:42px 12px;color:var(--muted)}
.loading{height:12px;margin:15px 0;border-radius:99px;background:linear-gradient(90deg,#ffffff08,#ffffff20,#ffffff08);background-size:200% 100%;animation:shine 1.2s infinite}
@keyframes shine{to{background-position:-200% 0}}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>div:first-child{min-width:0;overflow-wrap:anywhere}
.row strong{display:block;overflow-wrap:anywhere}
.row small{display:block;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:14px}
.cardlink{color:inherit;text-decoration:none}
.cardlink:hover{border-color:var(--accent)}
textarea,input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#0006;padding:12px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#000b;backdrop-filter:blur(12px);overflow-y:auto}
.modal.on{display:flex}
.dialog{width:min(430px,100%);max-height:90%;overflow-y:auto;border:1px solid var(--line);border-radius:22px;padding:25px;background:#121629}
.dialog input{margin:12px 0}
.toast{position:fixed;z-index:30;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#20283a;border:1px solid var(--line);border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px}
.editors{display:grid;gap:12px;min-width:0}
.editorbox{min-width:0;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#090b12}
.editorhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 13px;background:#ffffff09;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.1em}
.editorbox textarea{display:block;min-height:160px;resize:vertical;border:0;border-radius:0;background:#080a10;font:13px/1.65 monospace;tab-size:2}
.preview{display:block;width:100%;height:570px;border:1px solid var(--line);border-radius:15px;background:#fff}
.labtoolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}
@media(max-width:800px){
body{flex-direction:column-reverse;height:100vh;height:100dvh;min-height:0;overflow:hidden}
nav{width:auto;flex:0 0 auto;min-height:0;max-height:none;overflow:visible;margin:0 9px calc(7px + env(safe-area-inset-bottom));padding:6px;flex-direction:row;justify-content:space-around;border-radius:19px;gap:2px}
.logo,.navbottom{display:none}
nav button{flex:1 1 0;min-width:0;justify-content:center;flex-direction:column;gap:2px;padding:8px 2px;font-size:10px;text-align:center}
main{flex:1 1 0;width:100%;min-width:0;min-height:0;height:auto;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:21px 14px 35px}
.wrap{width:100%;min-height:0}
.topline{margin-bottom:23px}
.panel{padding:17px}
.lab{grid-template-columns:minmax(0,1fr)}
.preview{height:450px}
.image-preview img{height:110px}
.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
.gallery img{height:155px}
}
@media(max-width:380px){
nav button{font-size:9px}
.searchbar{padding-left:12px}
.searchbar input{font-size:14px}
.searchbar .primary{padding:10px 13px}
.actions{gap:6px}
.secondary{padding:8px 10px;font-size:12px}
.result img{width:72px;height:72px}
.image-preview img{height:90px}
}
/* ===== large screens: side menu with no card / bar ===== */
@media(min-width:801px){
nav{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
}

/* ===== Code Lab IDE (Spck-style) ===== */
body.labmode main{overflow:hidden;padding:10px;display:flex;flex-direction:column;touch-action:auto}
body.labmode .wrap{max-width:none;flex:1 1 0;min-height:0;height:auto}
.ide{position:relative;height:100%;display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:16px;background:#0a0c14;overflow:hidden;font-size:13px}
.ide button{font:inherit;color:inherit}
.ide-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#0e1120;border-bottom:1px solid var(--line);flex:0 0 auto}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:36px;height:36px;padding:0 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:#cfd8ec;font-weight:700;white-space:nowrap;position:relative}
.ib:hover,.ib.on{background:#ffffff14;border-color:var(--line)}
.ib.run{background:#16a34a;color:#fff}
.ib.run:hover{background:#22c55e}
.ib.proj{max-width:46vw;min-width:0}
.ib.proj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ide-sp{flex:1}
.ide-save{font-size:11px;color:var(--muted);white-space:nowrap;padding:0 6px}
.ide-body{position:relative;flex:1 1 0;min-height:0;display:flex}
.ide-files,.ide-edit,.ide-prev{min-width:0;min-height:0;display:flex;flex-direction:column}
.ide-files{flex:0 0 232px;border-right:1px solid var(--line);background:#0c0f1a}
.ide-edit{flex:1 1 0;background:#080a10}
.ide-prev{flex:0 0 40%;border-left:1px solid var(--line);background:#0c0f1a}
.ide:not(.files-on) .ide-files{display:none}
.ide:not(.prev-on) .ide-prev{display:none}
.ide[data-mode=mid] .ide-files{position:absolute;z-index:6;left:0;top:0;bottom:0;width:min(280px,86%);box-shadow:14px 0 40px #000b}
.ide.maxprev[data-mode=wide] .ide-files,.ide.maxprev[data-mode=wide] .ide-edit,.ide.maxprev[data-mode=mid] .ide-edit{display:none}
.ide.maxprev[data-mode=wide] .ide-prev,.ide.maxprev[data-mode=mid] .ide-prev{display:flex;flex:1 1 0;border-left:0}
.ide[data-mode=narrow] .ide-files,.ide[data-mode=narrow] .ide-edit,.ide[data-mode=narrow] .ide-prev{flex:1 1 0;border:0;display:none;position:static;width:auto;box-shadow:none}
.ide[data-mode=narrow][data-pane=files] .ide-files{display:flex}
.ide[data-mode=narrow][data-pane=editor] .ide-edit{display:flex}
.ide[data-mode=narrow][data-pane=preview] .ide-prev{display:flex}
.ide[data-mode=narrow] .hide-n{display:none}
.cl-fhead{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.cl-fhead>span{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);padding-left:4px}
.cl-fact{display:flex;gap:4px;flex-wrap:wrap}
.cl-fb{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#ffffff0b;color:#dbe4f7;font-weight:700;font-size:12px}
.cl-fb:hover{background:#ffffff18}
.cl-tree{flex:1;overflow:auto;padding:6px 0;-webkit-overflow-scrolling:touch}
.cl-row{display:flex;align-items:center;gap:7px;min-height:36px;padding:2px 4px 2px 8px;cursor:pointer;color:#cbd5e8;white-space:nowrap;user-select:none}
.cl-row:hover{background:#ffffff0d}
.cl-row.on{background:#3b82f626;color:#fff}
.cl-row.sel{background:#ffffff10}
.cl-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cl-m{flex:0 0 auto;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:16px}
.cl-m:hover{background:#ffffff18;color:#fff}
.cl-none{padding:18px 14px;color:var(--muted);font-size:13px}
.fi{flex:0 0 auto;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-size:9px;font-weight:900;color:#fff;background:#475569}
.fi-html{background:#e44d26}.fi-css{background:#2965f1}.fi-js{background:#d4a800;color:#111}.fi-json{background:#6b7280}.fi-md{background:#0ea5e9}.fi-img{background:#a855f7}.fi-dir{background:transparent;color:#fbbf24;font-size:12px}
.cl-tabs{display:flex;overflow-x:auto;background:#0e1120;border-bottom:1px solid var(--line);scrollbar-width:none;flex:0 0 auto;min-height:38px}
.cl-tabs::-webkit-scrollbar{display:none}
.cl-tab{display:flex;align-items:center;gap:7px;padding:0 4px 0 12px;height:38px;border-right:1px solid var(--line);color:var(--muted);white-space:nowrap;cursor:pointer;flex:0 0 auto}
.cl-tab.on{background:#080a10;color:#fff;box-shadow:inset 0 -2px var(--accent)}
.cl-tab button{width:26px;height:26px;border:0;border-radius:6px;background:transparent;color:inherit;font-size:15px}
.cl-tab button:hover{background:#ffffff18}
.cl-find{display:none;gap:6px;flex-wrap:wrap;padding:8px;background:#0e1120;border-bottom:1px solid var(--line);flex:0 0 auto}
.cl-find.on{display:flex}
.cl-find input{flex:1 1 110px;min-width:0;width:auto;padding:7px 10px;border-radius:8px;font-size:13px}
.cl-ed{position:relative;flex:1 1 0;min-height:0;overflow:hidden;background:#080a10}
.cl-gut,.cl-gutin,.cl-hl,.cl-ta{font:13px/20px "SFMono-Regular",Consolas,Menlo,"Liberation Mono",monospace;tab-size:2;-moz-tab-size:2;-webkit-text-size-adjust:100%;letter-spacing:0}
.cl-gut{position:absolute;left:0;top:0;bottom:0;width:46px;overflow:hidden;background:#080a10;border-right:1px solid #ffffff0c;user-select:none;z-index:2;pointer-events:none}
.cl-gutin{margin:0;padding:10px 8px 60px 0;white-space:pre;text-align:right;color:#586079;will-change:transform}
.cl-hl{position:absolute;left:46px;top:0;margin:0;padding:10px 12px 60px;white-space:pre;pointer-events:none;color:#d6deef;min-width:max-content;will-change:transform}
.cl-ta{position:absolute;left:46px;top:0;right:0;bottom:0;width:calc(100% - 46px);height:100%;margin:0;padding:10px 12px 60px;border:0;border-radius:0;background:transparent;color:transparent;caret-color:#fff;resize:none;white-space:pre;overflow:auto;overflow-wrap:normal;outline:none;z-index:1;-webkit-overflow-scrolling:touch}
.ide textarea:focus-visible,.ide input:focus-visible{outline:none}
.cl-ta::selection{background:#3b82f666;color:transparent}
.t-c{color:#6b7a99;font-style:italic}.t-s{color:#a5d6a7}.t-k{color:#c792ea}.t-n{color:#f78c6c}.t-t{color:#7fd1ff}.t-a{color:#ffcb6b}.t-p{color:#82aaff}.t-f{color:#82aaff}.t-d{color:#89ddff}
.cl-empty{display:grid;place-items:center;text-align:center;gap:12px;height:100%;padding:24px;color:var(--muted)}
.cl-img{height:100%;overflow:auto;display:grid;place-items:center;padding:16px;text-align:center;color:var(--muted);gap:10px;background:repeating-conic-gradient(#ffffff08 0 25%,transparent 0 50%) 0 0/20px 20px}
.cl-img img{max-width:100%;max-height:60vh;border-radius:8px}
.cl-keys{display:none;gap:5px;overflow-x:auto;padding:6px;background:#0e1120;border-top:1px solid var(--line);scrollbar-width:none;flex:0 0 auto}
.cl-keys::-webkit-scrollbar{display:none}
.cl-keys button{flex:0 0 auto;min-width:40px;height:36px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:#ffffff0d;color:#e5ecff;font:700 14px monospace}
@media(pointer:coarse){.cl-keys{display:flex}}

<script>
// ===== Loading Screen Script =====
(function initLoadingScreen(){
  const duration = 11000; // 11 seconds
  const startTime = Date.now();
  const fill = document.getElementById("ls-progress");
  const status = document.getElementById("ls-status");
  const screen = document.getElementById("lumen-loading-screen");
  
  const messages = [
    { time: 0, text: "Initializing environment…" },
    { time: 2500, text: "Connecting workspace…" },
    { time: 5500, text: "Loading Code Lab engine…" },
    { time: 8500, text: "Finalizing setups…" }
  ];

  function updateLoading(){
    const elapsed = Date.now() - startTime;
    const progress = Math.min(100, (elapsed / duration) * 100);
    
    if(fill) fill.style.width = progress + "%";
    
    // Update status text based on elapsed time
    for(let i = messages.length - 1; i >= 0; i--){
      if(elapsed >= messages[i].time){
        if(status && status.textContent !== messages[i].text){
          status.textContent = messages[i].text;
        }
        break;
      }
    }

    if(elapsed < duration){
      requestAnimationFrame(updateLoading);
    } else {
      if(fill) fill.style.width = "100%";
      if(status) status.textContent = "Ready";
      setTimeout(() => {
        if(screen) screen.classList.add("hidden");
      }, 300);
    }
  }
  requestAnimationFrame(updateLoading);
})();

const CONFIG={SEARCH_ENDPOINT:"",AI_ENDPOINT:"",RUN_ENDPOINT:"https://emkc.org/api/v2/piston/execute"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
let state={saved:[],projects:[]};
try{const old=JSON.parse(localStorage.getItem("lumen")||"{}");state.saved=Array.isArray(old.saved)?old.saved:[];state.projects=Array.isArray(old.projects)?old.projects:[]}catch(e){}
let view="search",tab="all",current=null,openProject=null,query="",busy=false;
const persist=()=>{try{localStorage.setItem("lumen",JSON.stringify(state))}catch(e){toast("Storage is full")}};
function toast(message){const t=$("#toast");t.textContent=message;t.classList.add("on");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("on"),2300)}
function safeURL(value){try{const u=new URL(value);return["https:","http:"].includes(u.protocol)?u.href:""}catch(e){return""}}
function cleanContent(value){
let text=String(value??"");
for(let i=0;i<3;i++){
text=text.replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi," ").replace(/<style\b[^>]*>[\s\S]*?<\/style\s*>/gi," ").replace(/<(br|\/p|\/div|\/li|\/h[1-6]|\/section|\/article)\b[^>]*>/gi,"\n").replace(/<[^>]*>/g," ");
const decoder=document.createElement("textarea");
decoder.innerHTML=text;
text=decoder.value;
}
return text.replace(/\r/g,"").replace(/[ \t]+\n/g,"\n").replace(/\n[ \t]+/g,"\n").replace(/\n{3,}/g,"\n\n").trim()
}
function cleanText(value){return cleanContent(value).replace(/\s+/g," ").trim()}
function cleanItem(item){
if(!item||typeof item!=="object")return item;
const out={...item};
for(const key of ["title","name","snippet","description","source","answer","extract","text","summary"]){
if(typeof out[key]==="string")out[key]=["answer","extract","text"].includes(key)?cleanContent(out[key]):cleanText(out[key])
}
if(typeof out.url==="string")out.url=safeURL(out.url)||"";
if(Array.isArray(out.results))out.results=out.results.map(cleanItem);
if(Array.isArray(out.items))out.items=out.items.map(cleanItem);
if(Array.isArray(out.images))out.images=out.images.map(cleanItem);
return out
}
function searchURL(q,mode="search"){
const p=new URLSearchParams({q});
if(mode==="images")p.set("tbm","isch");
if(mode==="videos")p.set("tbm","vid");
if(mode==="news")p.set("tbm","nws");
if(mode==="maps")return"https://www.google.com/maps/search/"+encodeURIComponent(q);
return"https://www.google.com/search?"+p.toString()
}
async function getJSON(url,options={}){
const r=await fetch(url,options);
if(!r.ok)throw Error("Request failed");
return r.json()
}
async function searchProvider(q,mode){
if(!CONFIG.SEARCH_ENDPOINT)return null;
return cleanItem(await getJSON(CONFIG.SEARCH_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,mode})}))
}
async function askAI(q,deep){
if(!CONFIG.AI_ENDPOINT)return null;
return cleanItem(await getJSON(CONFIG.AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,deep})}))
}
async function wikiSearch(q){
return getJSON("https://en.wikipedia.org/w/api.php?"+new URLSearchParams({action:"query",list:"search",srsearch:q,srlimit:"6",format:"json",origin:"*"}))
}
async function publicAnswer(q,deep){
const found=await wikiSearch(q);
const results=found.query?.search||[];
if(!results.length)return{title:q,empty:true,results:[]};
const normalized=q.toLowerCase().replace(/[?!.]+$/g,"").trim();
const exact=results.find(r=>r.title.toLowerCase()===normalized);
const phraseMatch=results.find(r=>r.title.toLowerCase().includes(normalized)||normalized.includes(r.title.toLowerCase()));
const best=exact||phraseMatch||results[0];
const articleURL=title=>"https://en.wikipedia.org/w/api.php?"+new URLSearchParams({action:"query",prop:"extracts",explaintext:"1",exchars:deep?24000:18000,exsectionformat:"plain",titles:title,redirects:"1",format:"json",origin:"*"});
let summary={};
try{summary=await getJSON("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(best.title))}catch(e){}
let answer="";
try{
const detail=await getJSON(articleURL(best.title));
const page=Object.values(detail.query?.pages||{})[0];
answer=page?.extract||""
}catch(e){}
if(!answer.trim())answer=summary.extract||"";
const related=results.filter(r=>r.title!==best.title).slice(0,5).map(r=>({title:cleanText(r.title),snippet:cleanText(r.snippet),url:"https://en.wikipedia.org/wiki/"+encodeURIComponent(r.title.replace(/ /g,"_"))}));
if(answer.trim().length<4500&&related.length){
const extra=[];
for(const item of related.slice(0,deep?3:2)){
try{
const detail=await getJSON(articleURL(item.title));
const page=Object.values(detail.query?.pages||{})[0];
const extract=cleanContent(page?.extract||"");
if(extract.length>450)extra.push({title:item.title,extract:extract.slice(0,deep?6500:4000)})
}catch(e){}
}
if(extra.length)answer=answer.trim()+"\n\nADDITIONAL RELATED CONTEXT\n\n"+extra.map(item=>item.title+"\n\n"+item.extract).join("\n\n────────────────────\n\n")
}
if(!answer.trim())answer="A detailed article could not be retrieved for this topic. Try a more specific search or open the web results to explore reliable sources.";
return cleanItem({title:best.title,description:summary.description||"",answer,hero:summary.originalimage?.source||summary.thumbnail?.source||"",source:"Wikipedia",sourceUrl:summary.content_urls?.desktop?.page||"https://en.wikipedia.org/wiki/"+encodeURIComponent(best.title.replace(/ /g,"_")),results,images:[]})
}
async function imageSearch(q){
const data=await getJSON("https://commons.wikimedia.org/w/api.php?"+new URLSearchParams({action:"query",generator:"search",gsrsearch:q,gsrnamespace:"6",gsrlimit:"50",prop:"imageinfo",iiprop:"url|extmetadata",iiurlwidth:"600",format:"json",origin:"*"}));
return Object.values(data.query?.pages||{}).map(p=>({title:cleanText(p.title.replace(/^File:/,"")),src:p.imageinfo?.[0]?.thumburl||p.imageinfo?.[0]?.url||"",url:p.imageinfo?.[0]?.descriptionurl||"",description:cleanText(p.imageinfo?.[0]?.extmetadata?.ImageDescription?.value||"")})).filter(i=>i.src&&safeURL(i.src))
}
function header(title,subtitle){
return`<div class="topline"><div><div class="eyebrow">Lumen workspace</div><div class="status">${esc(cleanText(subtitle||"Search · Discover · Create"))}</div></div><button class="secondary" data-action="clear">Clear</button></div><h1>${esc(cleanText(title))}</h1>`
}
function searchBar(value=""){
return`<form class="searchbar" id="searchform"><input id="query" value="${esc(value)}" placeholder="Ask anything or search the web…" autocomplete="off" aria-label="Search Lumen"><button class="primary" ${busy?"disabled":""}>${busy?"Searching…":"Search"}</button></form>`
}
function categoryTabs(){
return`<div class="tabs" aria-label="Search categories">${[["all","All"],["images","Images"],["videos","Videos"],["news","News"],["maps","Maps"]].map(([id,label])=>`<button class="tab ${tab===id?"on":""}" data-tab="${id}">${label}</button>`).join("")}</div>`
}
function home(){
return`${header(view==="research"?"Research anything.":"What do you want to know?",view==="research"?"Explore a topic in more depth.":"Answers, images, research and discovery.")}<p class="sub">Search for a topic, explore relevant images, and discover related resources. Each new search clears the previous results from the screen.</p>${searchBar(query)}${categoryTabs()}${current?"":`<div class="suggestions">${["How does Starlink work?","Ghana technology news","Solar system","HTML and CSS basics"].map(s=>`<button class="chip" data-query="${esc(s)}">${esc(s)}</button>`).join("")}</div>`}<div id="results">${renderResults()}</div>`
}
function renderResults(){
if(!current)return`<div class="panel empty"><div style="font-size:40px">✳</div><h2>Explore something new</h2><p>Start a search to see answers and related resources here.</p></div>`;
if(current.loading)return`<div class="panel"><div class="loading"></div><div class="loading"></div><div class="loading"></div><p class="muted">Searching for ${esc(query)}…</p></div>`;
if(current.error)return`<div class="panel"><h2>We couldn't load those results</h2><p class="muted">${esc(cleanText(current.error))}</p><button class="primary" data-action="retry">Try again</button></div>`;
if(tab==="images"){
if(current.imagesLoading)return`<div class="panel"><h2>Images for ${esc(query)}</h2><p class="muted">Finding related images…</p><div class="loading"></div><div class="loading"></div><div class="loading"></div></div>`;
const imgs=current.images||[];
if(!imgs.length)return`<div class="panel"><h2>Images for ${esc(query)}</h2><p class="muted">${current.imagesError?"Images could not be retrieved. Check your connection and try again.":"No images have been loaded for this search yet."}</p><div class="actions" style="margin-top:15px"><button class="primary" data-action="retryimages">Try again</button><a class="secondary" href="${esc(searchURL(query,"images"))}" target="_blank" rel="noopener">Open image search ↗</a></div></div>`;
return`<div class="panel"><div class="eyebrow">Image gallery</div><h2 style="margin-top:8px">Images for ${esc(query)}</h2><p class="muted" style="margin-bottom:18px">Select an image to open its original source.</p><div class="gallery">${imgs.map(i=>`<a href="${esc(safeURL(i.url)||safeURL(i.src))}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(safeURL(i.src))}" alt="${esc(cleanText(i.title))}"><span>${esc(cleanText(i.title))}</span></a>`).join("")}</div><p class="muted" style="margin-top:18px">Images provided by Wikimedia Commons. Source pages contain further image details.</p><p style="margin-top:12px"><a class="link" href="${esc(searchURL(query,"images"))}" target="_blank" rel="noopener">Explore more images ↗</a></p></div>`
}
if(["videos","news","maps"].includes(tab)){
const labels={videos:"Videos",news:"News",maps:"Maps"};
const category=current.categoryResults?.[tab]||current.categoryResults;
const items=category?.results||category?.items||[];
return`<div class="panel"><div class="eyebrow">${labels[tab]}</div><h2 style="margin-top:8px">${labels[tab]} for ${esc(query)}</h2>${items.length?items.map(r=>`<div class="result"><div><a href="${esc(safeURL(r.url)||searchURL(query,tab))}" target="_blank" rel="noopener">${esc(cleanText(r.title||r.name||"Open result"))}</a><p>${esc(cleanText(r.snippet||r.description||""))}</p></div></div>`).join(""):`<p class="muted">Explore current ${labels[tab].toLowerCase()} results for your search.</p>`}<p style="margin-top:16px"><a class="primary" href="${esc(searchURL(query,tab))}" target="_blank" rel="noopener">Explore ${labels[tab]} ↗</a></p></div>`
}
const a=current;
if(a.empty)return`<div class="panel"><h2>No matching answer found</h2><p class="muted">We couldn't find a matching article for "${esc(query)}". Try a more specific query or explore web results.</p><a class="link" href="${esc(searchURL(query))}" target="_blank" rel="noopener">Search the web ↗</a></div>`;
return`${a.images?.length?`<div class="panel"><div class="eyebrow">Image preview</div><h2 style="margin-top:8px">Explore ${esc(cleanText(a.title||query))} visually</h2><div class="image-preview">${a.images.slice(0,3).map(i=>`<a href="${esc(safeURL(i.url)||safeURL(i.src))}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(safeURL(i.src))}" alt="${esc(cleanText(i.title))}"></a>`).join("")}</div><button class="secondary" data-tab="images">View all images for this search →</button></div>`:""}
<div class="panel"><div class="eyebrow">Search answer</div><div class="word" style="margin-top:9px">${esc(cleanText(a.title||query))}</div>${a.description?`<p class="muted" style="margin-top:8px">${esc(cleanText(a.description))}</p>`:""}<div class="actions" style="margin-top:17px"><button class="secondary" data-action="speak">🔊 Listen</button><button class="secondary" data-action="save">${isSaved(a.title)?"★ Saved":"☆ Save answer"}</button><button class="secondary" data-action="addproject">＋ Add to project</button></div>${safeURL(a.hero)?`<img class="hero" src="${esc(safeURL(a.hero))}" alt="${esc(cleanText(a.title))}" loading="lazy">`:""}<div class="answer">${esc(cleanContent(a.answer||"No written answer was returned."))}</div>${safeURL(a.sourceUrl)?`<p style="margin-top:15px"><a class="link" href="${esc(safeURL(a.sourceUrl))}" target="_blank" rel="noopener">Source: ${esc(cleanText(a.source||"Original article"))} ↗</a></p>`:""}</div>
${a.results?.length?`<div class="panel"><h2>Related results</h2>${a.results.map(r=>`<div class="result"><div><a href="${esc(safeURL(r.url)||searchURL(cleanText(r.title||query)))}" target="_blank" rel="noopener">${esc(cleanText(r.title||"Related result"))}</a><p>${esc(cleanText(r.snippet||r.description||"Open the source to read more."))}</p><button class="secondary" data-query="${esc(cleanText(r.title))}" style="margin-top:8px">Explore in Lumen</button></div></div>`).join("")}</div>`:""}
<div class="panel"><h2>Explore more</h2><div class="actions"><button class="secondary" data-tab="images">Images</button><button class="secondary" data-tab="videos">Videos</button><button class="secondary" data-tab="news">News</button><button class="secondary" data-tab="maps">Maps</button><a class="secondary" href="${esc(searchURL(query))}" target="_blank" rel="noopener">Web results ↗</a></div></div>`
}
function isSaved(title){return state.saved.some(s=>cleanText(s.title).toLowerCase()===cleanText(title).toLowerCase())}
function render(){
clTeardown();document.body.classList.toggle("labmode",view==="lab");
document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===view));
const app=$("#app");
if(view==="search"||view==="research"){
app.innerHTML=(current&&current.loading)?`<div class="searchonly">${searchBar(query)}</div>`:home();
$("#searchform").onsubmit=e=>{e.preventDefault();performSearch($("#query").value.trim())}
}else if(view==="lab"){
clMount()
}else if(view==="learn"){

async function performSearch(q){

query=q;
tab="all";
view=view==="research"?"research":"search";
busy=true;
current={loading:true};
render();
try{
let result=await searchProvider(q,"all");
if(!result){
const ai=await askAI(q,view==="research");
result=ai||await publicAnswer(q,view==="research")
}
if(!result||typeof result!=="object")throw Error("Invalid response");
result=cleanItem(result);
if(!result.title)result.title=q;
if(!result.results)result.results=[];
current=result;
current.images=[];
current.imagesLoading=false;
current.imagesError=false;
try{current.images=(await imageSearch(q)).slice(0,3)}catch(e){current.images=[]}
if(!current.empty&&!current.answer&&!current.results.length)current.empty=true
}catch(e){
current={error:"No reliable answer could be retrieved. Check your connection or try another search.",title:q,images:[]}
}finally{
busy=false;
render()
}
}

}catch(e){

function hl(src,rules,flags){
const re=new RegExp(rules.map(r=>"("+r[0]+")").join("|"),flags||"g");
let out="",last=0,m;
while((m=re.exec(src))!==null){
if(m[0]===""){re.lastIndex++;continue}
out+=esc(src.slice(last,m.index));
let g=1;while(g<=rules.length&&m[g]===undefined)g++;
const c=rules[g-1][1];
out+=c?'<span class="'+c+'">'+esc(m[0])+"</span>":esc(m[0]);
last=re.lastIndex
}

}

}

}

function clTree(p){
const root={dirs:{},files:[],path:""};
const dive=(parts,upto)=>{let n=root;for(let i=0;i<upto;i++){const k=parts[i];n=n.dirs[k]||(n.dirs[k]={dirs:{},files:[],path:parts.slice(0,i+1).join("/")})}return n};
for(const f of p.files){const parts=f.path.split("/");dive(parts,parts.length-1).files.push(f)}
for(const d of p.dirs){const parts=d.split("/");dive(parts,parts.length)}
return root
}
function clTreeHTML(n,depth,p){
let h="";
for(const k of Object.keys(n.dirs).sort((a,b)=>a.localeCompare(b))){
const d=n.dirs[k],open=p.expanded[d.path]!==false;
h+=`<div class="cl-row${clSelDirV===d.path?" sel":""}" data-cl="dir" data-path="${esc(d.path)}" style="padding-left:${8+depth*14}px"><span class="fi fi-dir">${open?"▾":"▸"}</span><span class="cl-name">📁 ${esc(k)}</span><button class="cl-m" data-cl="fmenu" data-kind="dir" data-path="${esc(d.path)}" aria-label="Folder options">⋯</button></div>`;
if(open)h+=clTreeHTML(d,depth+1,p)
}
for(const f of n.files.slice().sort((a,b)=>baseOf(a.path).localeCompare(baseOf(b.path)))){
h+=`<div class="cl-row${f.path===p.active?" on":""}" data-cl="open" data-path="${esc(f.path)}" style="padding-left:${8+depth*14}px"><span class="fi ${fiClass(f.path)}">${fiLabel(f.path)}</span><span class="cl-name">${esc(baseOf(f.path))}</span><button class="cl-m" data-cl="fmenu" data-kind="file" data-path="${esc(f.path)}" aria-label="File options">⋯</button></div>`
}
return h
}
function clRenderFiles(){
const el=$("#cltree");if(!el)return;

el.innerHTML=p.files.length||p.dirs.length?clTreeHTML(clTree(p),0,p):`<div class="cl-none">No files yet.<br>Tap “+ File” to create one, or “Upload” to add your own.</div>`;

}

function clHighlight(){

const f=clF(clP().active);
const v=ta.value;
hlEl.innerHTML=(v.length>250000?esc(v):clHL(v,extOf(f?f.path:"")))+"\n";

function clSync(){

}
function clStatus(){
const el=$("#clstatus");if(!el)return;
const p=clP(),f=clF(p.active);
if(!f){el.textContent="No file open";return}
const ta=document.getElementById("clta");

if(ta){const s=ta.selectionStart,b=ta.value.slice(0,s);pos="Ln "+b.split("\n").length+", Col "+(s-b.lastIndexOf("\n"))+(ta.selectionEnd!==s?" ("+(ta.selectionEnd-s)+" selected)":"")+" · "}

el.innerHTML="<span>"+pos+lang+"</span><span>Spaces: 2</span><span>UTF-8</span>"
}

function clOnInput(){
const p=clP(),f=clF(p.active),ta=$("#clta");if(!f||!ta)return;
f.content=ta.value;p.updated=Date.now();

}
function clInsert(ta,text,back){
ta.focus();
let ok=false;
try{ok=document.execCommand&&document.execCommand("insertText",false,text)}catch(e){}
if(!ok){ta.setRangeText(text,ta.selectionStart,ta.selectionEnd,"end");ta.dispatchEvent(new Event("input",{bubbles:true}))}
if(back){const q=ta.selectionEnd-back;ta.setSelectionRange(q,q)}
}
function clIndent(ta){
const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;
if(s===e){clInsert(ta,"  ");return}
const ls=v.lastIndexOf("\n",s-1)+1,block=v.slice(ls,e);
ta.setSelectionRange(ls,e);
clInsert(ta,block.replace(/^/gm,"  "));
ta.setSelectionRange(s+2,e+2*block.split("\n").length)
}
function clOutdent(ta){
const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;
const ls=v.lastIndexOf("\n",s-1)+1,block=v.slice(ls,e);
const out=block.replace(/^(?: {1,2}|\t)/gm,"");
if(out===block)return;
ta.setSelectionRange(ls,e);clInsert(ta,out);
const removedFirst=block.length-block.replace(/^(?: {1,2}|\t)/,"").length;
ta.setSelectionRange(Math.max(ls,s-removedFirst),ls+out.length)
}
const VOID_TAGS=new Set(["area","base","br","col","embed","hr","img","input","link","meta","param","source","track","wbr"]);
function clKeydown(e){
const ta=e.target,f=clF(clP().active);
if(!f)return;
const mod=e.ctrlKey||e.metaKey;
if(mod&&e.key.toLowerCase()==="s"){e.preventDefault();clSaveNow();toast("Saved");return}
if(mod&&e.key.toLowerCase()==="f"){e.preventDefault();clToggleFind(true);return}
if(e.key==="Tab"){e.preventDefault();e.shiftKey?clOutdent(ta):clIndent(ta);return}
if(mod||e.altKey||e.isComposing)return;
const v=ta.value,s=ta.selectionStart,en=ta.selectionEnd;
if(e.key==="Enter"){
e.preventDefault();
const ls=v.lastIndexOf("\n",s-1)+1,line=v.slice(ls,s),ind=line.match(/^[ \t]*/)[0];
const prev=v.charAt(s-1),next=v.charAt(en);
const pairOpen="{[(".includes(prev)&&prev!==""&&"}])"["{[(".indexOf(prev)]===next;
const tagPair=prev===">"&&v.slice(en,en+2)==="</";
if(pairOpen||tagPair)clInsert(ta,"\n"+ind+"  \n"+ind,1+ind.length);
else clInsert(ta,"\n"+ind+(/[{(\[]\s*$/.test(line)?"  ":""));
return
}
const closing=")]}\"'`";
if(s===en&&closing.includes(e.key)&&v.charAt(s)===e.key){e.preventDefault();ta.setSelectionRange(s+1,s+1);return}
const pairs={"(":")","[":"]","{":"}",'"':'"',"'":"'","`":"`"};
if(pairs[e.key]&&s===en){
const before=v.charAt(s-1),after=v.charAt(s);
const quote=e.key==='"'||e.key==="'"||e.key==="`";
if(quote&&/[\w]/.test(before))return;
if(after&&/[\w]/.test(after))return;
e.preventDefault();clInsert(ta,e.key+pairs[e.key],1);return
}
if(e.key==="Backspace"&&s===en&&s>0){
const a=v.charAt(s-1),b=v.charAt(s);
if(pairs[a]&&pairs[a]===b){e.preventDefault();ta.setSelectionRange(s-1,s+1);clInsert(ta,"");return}
}
if(e.key===">"&&["html","htm","vue","xml","svg"].includes(extOf(f.path))&&s===en){
const lt=v.lastIndexOf("<",s-1);
if(lt>=0&&v.slice(lt,s).indexOf(">")<0){
const m=/^<([A-Za-z][\w:-]*)(?:\s[^<>]*)?$/.exec(v.slice(lt,s));
if(m&&!VOID_TAGS.has(m[1].toLowerCase())&&v.charAt(s-1)!=="/"){e.preventDefault();clInsert(ta,"></"+m[1]+">",m[1].length+3)}
}
}
}
function clKeyPress(k){
const ta=document.getElementById("clta");if(!ta)return;
ta.focus();
if(k==="Tab")clIndent(ta);
else if(k==="undo")document.execCommand("undo");
else if(k==="redo")document.execCommand("redo");
else clInsert(ta,k)
}

/* ---------- find & replace ---------- */
function clToggleFind(on){
clUI.find=on===undefined?!clUI.find:on;
const el=$("#clfind");if(el)el.classList.toggle("on",clUI.find);
if(clUI.find)setTimeout(()=>{const q=$("#clfq");if(q){q.focus();q.select()}},30)
}
function clFindNext(dir){
const ta=document.getElementById("clta"),q=$("#clfq").value;
if(!ta||!q)return;
const v=ta.value;
let i=dir>0?v.indexOf(q,ta.selectionEnd):(ta.selectionStart>0?v.lastIndexOf(q,ta.selectionStart-1):-1);
if(i<0)i=dir>0?v.indexOf(q):v.lastIndexOf(q);
if(i<0){toast("No matches");return}
ta.setSelectionRange(i,i+q.length);
const line=v.slice(0,i).split("\n").length-1;
ta.scrollTop=Math.max(0,line*(parseFloat(getComputedStyle(ta).lineHeight)||20)-ta.clientHeight/3);
clSync();clStatus()
}
function clReplace(all){
const ta=document.getElementById("clta"),q=$("#clfq").value,r=$("#clfr").value;
if(!ta||!q)return;
if(all){
const n=ta.value.split(q).length-1;if(!n){toast("No matches");return}
ta.focus();ta.setSelectionRange(0,ta.value.length);clInsert(ta,ta.value.split(q).join(r));toast("Replaced "+n+" match"+(n>1?"es":""));return
}
if(ta.value.slice(ta.selectionStart,ta.selectionEnd)===q){ta.focus();clInsert(ta,r)}
clFindNext(1)
}

/* ---------- file operations ---------- */
function clAddFile(path,content,bin,quiet){
const p=clP();path=normPath(path);
if(!path||badName(path)){if(!quiet)toast("Enter a valid file name");return false}
if(p.files.some(f=>f.path===path)){if(!quiet)toast("“"+path+"” already exists");return false}
if(p.dirs.includes(path)||p.files.some(f=>path.startsWith(f.path+"/"))||p.files.some(f=>f.path.startsWith(path+"/"))){if(!quiet)toast("That name conflicts with a folder");return false}
p.files.push({path,content:content||"",bin:!!bin});
return true
}
function clNewFile(dir){
const d=typeof dir==="string"?dir:clSelDirV;
clPrompt("New file",d?d+"/":"","Create",val=>{
const path=normPath(val);if(!path)return;
const start=isHtmlPath(path)?CL_STARTER_HTML:(CL_STARTERS[extOf(path)]||"");
if(clAddFile(path,start,false)){clChanged();clOpen(path)}
},"Use folders like css/theme.css")
}
function clNewFolder(dir){
const d=typeof dir==="string"?dir:clSelDirV;
clPrompt("New folder",d?d+"/":"","Create",val=>{
const path=normPath(val);if(!path||badName(path))return;
const p=clP();
if(p.dirs.includes(path)||p.files.some(f=>f.path===path)){toast("Already exists");return}
p.dirs.push(path);p.expanded[path]=true;clSelDirV=path;clChanged();clRenderFiles()
})
}
function clDelete(path,kind){
const p=clP();
if(!confirm("Delete "+(kind==="dir"?"folder “"+path+"” and everything inside it":"“"+path+"”")+"?"))return;
const inside=x=>x===path||x.startsWith(path+"/");
if(kind==="dir"){p.files=p.files.filter(f=>!inside(f.path));p.dirs=p.dirs.filter(d=>!inside(d))}
else p.files=p.files.filter(f=>f.path!==path);
p.open=p.open.filter(x=>!inside(x));
if(p.active&&inside(p.active))p.active=p.open[p.open.length-1]||null;
if(clPvPath&&inside(clPvPath))clPvPath=null;
if(clSelDirV&&inside(clSelDirV))clSelDirV="";
clChanged();clRenderTabs();clRenderFiles();clLoadEditor();clFillSel();clRun(false);toast("Deleted")
}
function clRename(path,kind){
clPrompt("Rename / move "+(kind==="dir"?"folder":"file"),path,"Rename",val=>{
const np=normPath(val),p=clP();
if(!np||np===path||badName(np))return;
if(kind==="dir"&&np.startsWith(path+"/")){toast("Can't move a folder into itself");return}
const map=x=>x===path?np:x.startsWith(path+"/")?np+x.slice(path.length):x;
const moving=p.files.filter(f=>kind==="dir"?(f.path===path||f.path.startsWith(path+"/")):f.path===path).map(f=>map(f.path));
const others=p.files.filter(f=>!(kind==="dir"?(f.path===path||f.path.startsWith(path+"/")):f.path===path)).map(f=>f.path);
if(moving.some(x=>others.includes(x))||(kind==="file"&&p.dirs.includes(np))){toast("That name already exists");return}
p.files.forEach(f=>{f.path=map(f.path)});
p.dirs=p.dirs.map(map);
p.open=p.open.map(map);
if(p.active)p.active=map(p.active);
const ex={};for(const k in p.expanded)ex[map(k)]=p.expanded[k];p.expanded=ex;
if(clPvPath)clPvPath=map(clPvPath);
if(clSelDirV)clSelDirV=map(clSelDirV);
clChanged();clRenderTabs();clRenderFiles();clLoadEditor();clFillSel();clRun(false)
})
}
function clDupFile(path){
const p=clP(),f=clF(path);if(!f)return;
const ext=extOf(path),stem=ext?path.slice(0,-(ext.length+1)):path;
let n=path,i=1;
while(p.files.some(x=>x.path===n)){n=stem+"-copy"+(i>1?i:"")+(ext?"."+ext:"");i++}
p.files.push({path:n,content:f.content,bin:f.bin});

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zipBlob(entries){

lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
chunks.push(lh.buffer,name,data);
const ch=new DataView(new ArrayBuffer(46));
ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
central.push(ch.buffer,name);

}
const cs=central.reduce((a,b)=>a+b.byteLength,0);

end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);

async function inflateRaw(u8){
const ds=new DecompressionStream("deflate-raw");
return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer())
}
async function clReadZip(file){
if(typeof DecompressionStream==="undefined")throw new Error("This browser can't open ZIP files");
const buf=new Uint8Array(await file.arrayBuffer()),dv=new DataView(buf.buffer);
let e=-1;
for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
if(e<0)throw new Error("That doesn't look like a ZIP file");
const n=dv.getUint16(e+10,true);let q=dv.getUint32(e+16,true);
const out=[],dec=new TextDecoder();
for(let k=0;k<n;k++){
if(dv.getUint32(q,true)!==0x02014b50)break;
const method=dv.getUint16(q+10,true),csize=dv.getUint32(q+20,true),nl=dv.getUint16(q+28,true),el=dv.getUint16(q+30,true),cl2=dv.getUint16(q+32,true),off=dv.getUint32(q+42,true);
const name=dec.decode(buf.subarray(q+46,q+46+nl));
q+=46+nl+el+cl2;
if(name.endsWith("/")||name.startsWith("__MACOSX/")||baseOf(name)===".DS_Store")continue;
const lnl=dv.getUint16(off+26,true),lel=dv.getUint16(off+28,true);

if(method===0)out.push({name,bytes:data.slice()});
else if(method===8)out.push({name,bytes:await inflateRaw(data)})
}
return out
}
function clStripRoot(entries){
if(entries.length&&entries.every(x=>x.name.includes("/"))){
const first=entries[0].name.split("/")[0];
if(entries.every(x=>x.name.split("/")[0]===first))return entries.map(x=>({...x,name:x.name.slice(first.length+1)}))
}

}
function clImportEntries(p,entries,prefix){
let added=0,replaced=0;
const dec=new TextDecoder();
for(const en of entries){
const path=normPath((prefix?prefix+"/":"")+en.name);
if(!path||badName(path))continue;
const text=TEXT_EXT.has(extOf(path));
const rec={path,content:text?dec.decode(en.bytes):"data:"+mimeOf(path)+";base64,"+bytesToB64(en.bytes),bin:!text};
const ex=p.files.find(f=>f.path===path);
if(ex){ex.content=rec.content;ex.bin=rec.bin;replaced++}else{p.files.push(rec);added++}
}

}
function blobToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
async function clUpload(files){
const p=clP();let added=0,replaced=0,last=null;
for(const file of files){

if(/\.zip$/i.test(file.name)){
const entries=clStripRoot(await clReadZip(file));
const r=clImportEntries(p,entries,clSelDirV);added+=r.added;replaced+=r.replaced;
const idx=entries.find(x=>baseOf(x.name)==="index.html");if(idx)last=normPath((clSelDirV?clSelDirV+"/":"")+idx.name);
continue
}
const ext=extOf(file.name);
const path=normPath((clSelDirV?clSelDirV+"/":"")+file.name);
if(badName(path))continue;
let rec;
if(TEXT_EXT.has(ext)||/^text\//.test(file.type)||/json|javascript|xml/.test(file.type))rec={path,content:await file.text(),bin:false};
else{
if(file.size>15*1024*1024){toast(file.name+" is too large (max 15 MB)");continue}
rec={path,content:await blobToDataURL(file),bin:true}
}
const ex=p.files.find(f=>f.path===path);
if(ex){ex.content=rec.content;ex.bin=rec.bin;replaced++}else{p.files.push(rec);added++}
last=path
}catch(err){toast(String(err.message||err))}
}

clChanged();clRenderFiles();

}

if(!fromFr&&!fromRn)return;
const d=e.data||{};
if(d.lumenReady){if(fromRn){clRunnerReady=true;if(clPyJob){rn.contentWindow.postMessage({lumenPy:clPyJob},"*");clPyJob=null}}return}
if(d.lumenConsole){
if(d.lumenConsole.level==="clear")clLogs=[];
else{clLogs.push(d.lumenConsole);if(clLogs.length>300)clLogs.shift()}
clRenderLogs()
}else if(fromFr&&typeof d.lumenNav==="string"){
const t=resolvePath(dirOf(clPvPath||""),d.lumenNav.split(/[?#]/)[0]);
if(clF(t)&&isHtmlPath(t)){clPvPath=t;clRun(false)}
else{clLogs.push({level:"error",text:"Page not found: "+d.lumenNav});clRenderLogs()}
}
});
function clOpenBrowser(path){
const p=clP(),entry=path&&isHtmlPath(path)?path:clEntry(p);
if(!entry){toast("Create an HTML file first");return}
const url=URL.createObjectURL(new Blob([clBuildDoc(p,entry,false)],{type:"text/html"}));
const w=window.open(url,"_blank");
if(!w)toast("Allow pop-ups to open the browser tab");
setTimeout(()=>URL.revokeObjectURL(url),180000)
}
function clDownloadHTML(){
const p=clP(),entry=clEntry(p);
if(!entry){toast("Create an HTML file first");return}
clSaveBlob(new Blob([clBuildDoc(p,entry,false)],{type:"text/html"}),(baseOf(entry)||"index.html"))
}

/* ---------- dialogs, menus, projects ---------- */
function clPrompt(title,value,label,cb,hint){
clModalCb=cb;
showModal(`<h2>${esc(title)}</h2>${hint?`<p class="muted" style="font-size:13px">${esc(hint)}</p>`:""}<input id="clinput" value="${esc(value||"")}" autocomplete="off" spellcheck="false" autocapitalize="off"><div class="actions" style="justify-content:flex-end;margin-top:6px"><button class="secondary" data-cl="mcancel">Cancel</button><button class="primary" data-cl="mok">${esc(label||"OK")}</button></div>`);
setTimeout(()=>{const i=$("#clinput");if(i){i.focus();const n=i.value.length;i.setSelectionRange(n,n)}},60)
}
function clMenu(title,items){
showModal(`<h2 style="font-size:19px">${esc(title)}</h2><div class="cl-menu">${items.map(i=>`<button class="${i.danger?"danger":""}${i.cur?" cur":""}" data-cl="${i.cl||"mact"}" data-do="${i.do||""}" data-path="${esc(i.path||"")}" data-kind="${i.kind||""}">${i.icon?`<span>${i.icon}</span>`:""}${esc(i.label)}</button>`).join("")}</div>`)
}
function clProjectsModal(){
clMenu("Projects",[...cl.projects.map(x=>({label:x.name,cl:"pick",path:x.id,cur:x.id===cl.current,icon:"📂"})),{label:"New project",do:"newproj",icon:"＋"},{label:"Import ZIP as new project",do:"impzip",icon:"⇪"}])
}
function clMainMenu(){
const d=clSelDirV;
clMenu(clP().name,[
{label:"New file",do:"newfileIn",path:d,icon:"＋"},
{label:"New folder",do:"newfolderIn",path:d,icon:"📁"},
{label:"Upload files / ZIP",do:"uploadIn",path:d,icon:"⇪"},
{label:"Find & replace",do:"find",icon:"⌕"},
{label:"Export project as ZIP",do:"zip",icon:"⇩"},
{label:"Download as one HTML file",do:"dlhtml",icon:"⇩"},
{label:"Live preview: "+(clUI.live?"On":"Off"),do:"live",icon:"◉"},
{label:"Rename project",do:"renproj",icon:"✎"},
{label:"Duplicate project",do:"dupproj",icon:"⧉"},
{label:"Delete project",do:"delproj",icon:"🗑",danger:true}
])
}
function clFileMenu(path,kind){
if(kind==="dir")return clMenu(path,[
{label:"New file here",do:"newfileIn",path,icon:"＋"},
{label:"New folder here",do:"newfolderIn",path,icon:"📁"},
{label:"Upload here",do:"uploadIn",path,icon:"⇪"},
{label:"Rename / move",do:"rename",path,kind,icon:"✎"},
{label:"Delete folder",do:"delete",path,kind,icon:"🗑",danger:true}
]);
const items=[];
if(isHtmlPath(path)){items.push({label:"Preview this page",do:"setprev",path,icon:"▶"},{label:"Open in browser tab",do:"obrowser",path,icon:"↗"})}
items.push({label:"Rename / move",do:"rename",path,kind,icon:"✎"},{label:"Duplicate",do:"dup",path,icon:"⧉"},{label:"Download",do:"dl",path,icon:"⇩"},{label:"Delete",do:"delete",path,kind,icon:"🗑",danger:true});
clMenu(path,items)
}
function clNewProject(){
clPrompt("New project","","Create",val=>{
const name=cleanText(val)||"Untitled project";
const np=clNewProjectData(name);
cl.projects.unshift(np);cl.current=np.id;clPvPath=null;clSelDirV="";clChanged();render()
})
}
function clModalAction(act,path,kind){
closeModal();
switch(act){
case"rename":clRename(path,kind);break;
case"delete":clDelete(path,kind);break;
case"dup":clDupFile(path);break;
case"dl":clDownloadFile(path);break;
case"obrowser":clOpenBrowser(path);break;
case"setprev":clPvPath=path;clFillSel();clRun(true);if(clNarrow())clSetPane("preview",true);break;
case"newfileIn":clNewFile(path);break;
case"newfolderIn":clNewFolder(path);break;
case"uploadIn":clSelDirV=path||"";$("#clupload").click();break;
case"newproj":clNewProject();break;
case"impzip":$("#clzip").click();break;
case"find":if(clNarrow())clSetPane("editor");clToggleFind(true);break;
case"zip":clExportZip();break;
case"dlhtml":clDownloadHTML();break;
case"live":clUI.live=!clUI.live;toast("Live preview "+(clUI.live?"on":"off"));break;
case"renproj":clPrompt("Rename project",clP().name,"Rename",val=>{const n=cleanText(val);if(n){clP().name=n;clChanged();clRenderFiles()}});break;
case"dupproj":{
const src=clP(),copy=JSON.parse(JSON.stringify(src));
copy.id=uid();copy.name=src.name+" copy";copy.created=copy.updated=Date.now();
cl.projects.unshift(copy);cl.current=copy.id;clPvPath=null;clChanged();render();toast("Project duplicated");break
}
case"delproj":
if(confirm("Delete project “"+clP().name+"” and all its files?")){
cl.projects=cl.projects.filter(x=>x.id!==cl.current);
if(!cl.projects.length)cl.projects.push(clNewProjectData("My first project"));
cl.current=cl.projects[0].id;clPvPath=null;clSelDirV="";clChanged();render()
}
break
}
}
function clClick(e){
if(!cl)return;
const t=e.target.closest("[data-cl]");if(!t)return;
const a=t.dataset.cl,path=t.dataset.path;
switch(a){
case"togfiles":
if(clNarrow())clSetPane(clUI.pane==="files"?"editor":"files");
else{clUI.files=!clUI.files;clResize()}
break;
case"togprev":clUI.prev=!clUI.prev;clUI.maxprev=false;clResize();if(clUI.prev)clRun(false);break;
case"projects":clProjectsModal();break;
case"pick":closeModal();if(path!==cl.current){cl.current=path;clPvPath=null;clSelDirV="";clChanged();render()}break;
case"run":clRunActive();break;
case"openbrowser":clOpenBrowser();break;
case"menu":clMainMenu();break;
case"dir":{const p=clP();p.expanded[path]=p.expanded[path]===false;clSelDirV=path;clChanged();clRenderFiles();break}
case"open":clOpen(path);break;
case"fmenu":clFileMenu(path,t.dataset.kind);break;
case"newfile":clNewFile();break;
case"newfolder":clNewFolder();break;
case"upload":$("#clupload").click();break;
case"tab":clOpen(path);break;
case"closetab":clCloseTab(path);break;
case"key":clKeyPress(t.dataset.k);break;
case"pane":clSetPane(t.dataset.p);break;
case"reload":clRun(true);break;
case"pvw":{clUI.w=clUI.w==="fit"?"375":clUI.w==="375"?"768":"fit";$("#clpv").dataset.w=clUI.w;toast(clUI.w==="fit"?"Preview: full width":"Preview: "+clUI.w+"px wide");break}
case"console":clUI.con=!clUI.con;$("#clcon").classList.toggle("on",clUI.con);break;
case"clearcon":clLogs=[];clRenderLogs();break;
case"maxprev":clUI.maxprev=!clUI.maxprev;clResize();break;
case"fprev":clFindNext(-1);break;
case"fnext":clFindNext(1);break;
case"frep":clReplace(false);break;
case"fall":clReplace(true);break;
case"fclose":clToggleFind(false);break;
case"mcancel":closeModal();break;
case"mok":{const i=$("#clinput"),v=i?i.value:"",cb=clModalCb;closeModal();clModalCb=null;if(cb)cb(v);break}
case"mact":clModalAction(t.dataset.do,path,t.dataset.kind);break
}
}
document.addEventListener("click",clClick);
document.addEventListener("keydown",e=>{
if(e.key==="Enter"&&e.target&&e.target.id==="clinput"){e.preventDefault();const ok=document.querySelector('[data-cl="mok"]');if(ok)ok.click()}
if(view==="lab"&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"&&cl){e.preventDefault();clSaveNow();toast("Saved")}
});
