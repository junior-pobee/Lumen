const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $i=i=>document.getElementById(i);
const KEY={none:["No key","#34d399"],free:["Free key","#fbbf24"],opt:["Key optional","#9acbff"],tok:["Token needed","#fbbf24"]};
const CATS=[
{id:"space",t:"Space & knowledge",n:"Space exploration and encyclopedic content.",i:[
 ["NASA Open APIs","Build a Space Exploration section: astronomy picture of the day, Mars photos and more.","https://api.nasa.gov","free"],
 ["Wikipedia REST API","Article summaries and encyclopedic content.","https://www.mediawiki.org/wiki/API:REST_API","none"]]},
{id:"news",t:"News & information",n:"Some news APIs require free registration and have usage restrictions. Article content may also have copyright restrictions, so display permitted excerpts and link to original sources where necessary.",i:[
 ["GNews","News headlines and articles metadata.","https://gnews.io","free"],
 ["The Guardian Open Platform","News articles and search results.","https://open-platform.theguardian.com","free"],
 ["Hacker News API","Technology news and discussions.","https://github.com/HackerNews/API","none","hn"],
 ["DEV Community API","Programming tutorials and developer articles.","https://developers.forem.com/api","opt"]]},
{id:"img",t:"Images & creative content",n:"",i:[
 ["Unsplash API","Search high-quality photographs. Display image galleries inside Lumen.","https://unsplash.com/developers","free"],
 ["Pexels API","Search photographs and videos. Create an in-app visual discovery engine.","https://www.pexels.com/api/","free"],
 ["Pixabay API","Search illustrations, photographs and other visual assets.","https://pixabay.com/api/docs/","free"]]},
{id:"sci",t:"Science, weather & geography",n:"Open-Meteo is particularly attractive because its non-commercial API supports browser requests without an API key.",i:[
 ["Open-Meteo","Weather forecasts, historical weather and air quality.","https://open-meteo.com/en/docs","none","weather"],
 ["World Bank API","Economic indicators, population and development statistics.","https://datahelpdesk.worldbank.org/knowledgebase/topics/125589","none"],
 ["Frankfurter","Currency exchange reference rates.","https://frankfurter.dev","none","currency"],
 ["Nager.Date","Public holidays across countries.","https://date.nager.at/Api","none","holidays"],
 ["OpenStreetMap","Geographic information and mapping data.","https://wiki.openstreetmap.org/wiki/API","none"]]},
{id:"tech",t:"Programming & technology",n:"These could make Lumen more attractive to developers.",i:[
 ["GitHub REST API","Repositories, commits, users and project information.","https://docs.github.com/en/rest","opt"],
 ["NPM Registry API","JavaScript packages and package information.","https://github.com/npm/registry/blob/main/docs/REGISTRY-API.md","none"],
 ["Stack Exchange API","Programming questions, answers and tags.","https://api.stackexchange.com/docs","opt"],
 ["Hugging Face","AI models, datasets and model information.","https://huggingface.co/docs/hub/api","tok"]]},
{id:"fun",t:"Food, entertainment & general interest",n:"",i:[
 ["TheMealDB","Recipe search and meal discovery.","https://www.themealdb.com/api.php","none","meal"],
 ["PokéAPI","Interactive Pokémon encyclopedia.","https://pokeapi.co/docs/v2","none","pokemon"],
 ["Open Food Facts","Food products and nutritional information.","https://openfoodfacts.github.io/openfoodfacts-server/api/","none"],
 ["TVmaze API","TV shows, episodes and cast information.","https://www.tvmaze.com/api","none"]]}
];
const j=async u=>{const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()};
const stats=rows=>'<div class="qx-stats">'+rows.map(r=>'<div class="qx-stat"><b>'+E(r[1])+'</b><span>'+E(r[0])+'</span></div>').join("")+'</div>';
const head=s=>'<div class="word" style="font-size:22px;margin-bottom:12px">'+s+'</div>';
const http=u=>/^https?:\/\//i.test(u||"")?u:"";
const DEMOS={
weather:{l:"Weather",ph:"City, e.g. Accra",d:"Accra",api:"Open-Meteo",run:async v=>{
 const g=await j("https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(v));const p=g.results&&g.results[0];if(!p)return"No place found.";
 const w=await j("https://api.open-meteo.com/v1/forecast?latitude="+p.latitude+"&longitude="+p.longitude+"&current=temperature_2m,relative_humidity_2m,wind_speed_10m&timezone=auto");const c=w.current,u=w.current_units;
 return head(E(p.name)+(p.country?", "+E(p.country):""))+stats([["Temperature",c.temperature_2m+u.temperature_2m],["Humidity",c.relative_humidity_2m+u.relative_humidity_2m],["Wind",c.wind_speed_10m+" "+u.wind_speed_10m]])}},
currency:{l:"Currency",ph:"e.g. 100 USD to EUR",d:"100 USD to EUR",api:"Frankfurter",run:async v=>{
 const m=v.match(/^([\d.,]+)\s*([a-z]{3})\s*(?:to|in|>|->|=)?\s*([a-z]{3})$/i);if(!m)return"Use the format: 100 USD to EUR";
 const a=parseFloat(m[1].replace(/,/g,"")),f=m[2].toUpperCase(),t=m[3].toUpperCase();let d;
 try{d=await j("https://api.frankfurter.dev/v1/latest?base="+f+"&symbols="+t+"&amount="+a)}catch(e){d=await j("https://api.frankfurter.app/latest?from="+f+"&to="+t+"&amount="+a)}
 const r=d.rates&&d.rates[t];if(r==null)return"That currency pair is not supported.";
 return head(E(a+" "+f+" = "+r.toLocaleString(undefined,{maximumFractionDigits:4})+" "+t))+'<p class="muted" style="font-size:13px">Reference rate for '+E(d.date)+'. Frankfurter covers major currencies only.</p>'}},
holidays:{l:"Holidays",ph:"Country code + year, e.g. GH 2026",d:"GH "+new Date().getFullYear(),api:"Nager.Date",run:async v=>{
 const m=v.match(/^([a-z]{2})\s*(\d{4})?$/i);if(!m)return"Use a 2-letter country code, e.g. GH 2026";
 const d=await j("https://date.nager.at/api/v3/PublicHolidays/"+(m[2]||new Date().getFullYear())+"/"+m[1].toUpperCase());
 return d.length?d.slice(0,14).map(h=>'<div class="row"><div><strong>'+E(h.name)+'</strong><small>'+E(h.localName)+'</small></div><span class="status">'+E(h.date)+'</span></div>').join(""):"No holidays found."}},
pokemon:{l:"Pokémon",ph:"Name or number, e.g. pikachu",d:"pikachu",api:"PokéAPI",run:async v=>{
 const p=await j("https://pokeapi.co/api/v2/pokemon/"+encodeURIComponent(v.toLowerCase()));const img=http(p.sprites&&p.sprites.front_default);
 return '<div class="cx-hero">'+(img?'<img src="'+E(img)+'" alt="" width="96" height="96" style="image-rendering:pixelated">':"")+'<div>'+head(E(p.name[0].toUpperCase()+p.name.slice(1)))+'<p class="muted">Type: '+E(p.types.map(x=>x.type.name).join(", "))+'</p></div></div>'+stats([["Height",p.height/10+" m"],["Weight",p.weight/10+" kg"],["Base XP",p.base_experience||"—"]])}},
meal:{l:"Recipes",ph:"Dish, e.g. chicken",d:"chicken",api:"TheMealDB",run:async v=>{
 const d=await j("https://www.themealdb.com/api/json/v1/1/search.php?s="+encodeURIComponent(v));if(!d.meals)return"No recipes found.";
 return d.meals.slice(0,4).map(m=>{const u=http(m.strSource)||http(m.strYoutube);return'<div class="result"><img src="'+E(http(m.strMealThumb))+'/preview" alt=""><div>'+(u?'<a href="'+E(u)+'" target="_blank" rel="noopener">'+E(m.strMeal)+'</a>':'<strong>'+E(m.strMeal)+'</strong>')+'<p>'+E(m.strCategory)+' · '+E(m.strArea)+'</p></div></div>'}).join("")}},
hn:{l:"Tech news",ph:"",d:"",api:"Hacker News API",noin:1,run:async()=>{
 const ids=(await j("https://hacker-news.firebaseio.com/v0/topstories.json")).slice(0,6);
 const it=await Promise.all(ids.map(i=>j("https://hacker-news.firebaseio.com/v0/item/"+i+".json")));
 return it.filter(Boolean).map(s=>{const u=http(s.url)||"https://news.ycombinator.com/item?id="+s.id;return'<div class="result"><div><a href="'+E(u)+'" target="_blank" rel="noopener">'+E(s.title)+'</a><p>'+E(s.score)+' points · by '+E(s.by)+' · '+E(s.descendants||0)+' comments</p></div></div>'}).join("")}}
};
const S={q:"",cat:"all",demo:"weather",star:ls.get("lumen_api_star",[])};
function list(){
 const q=S.q.trim().toLowerCase();let out="",n=0;
 CATS.forEach(c=>{if(S.cat!=="all"&&S.cat!=="star"&&S.cat!==c.id)return;
  const it=c.i.filter(a=>(S.cat!=="star"||S.star.includes(a[0]))&&(!q||(a[0]+" "+a[1]+" "+c.t).toLowerCase().includes(q)));if(!it.length)return;n+=it.length;
  out+='<div class="panel"><div class="eyebrow">'+E(c.t)+'</div>'+(c.n?'<p class="muted" style="margin:8px 0 4px;font-size:13px">'+E(c.n)+'</p>':'')+it.map(a=>{const k=KEY[a[3]],on=S.star.includes(a[0]);
  return'<div class="row ap-row"><div><a class="link" href="'+E(a[2])+'" target="_blank" rel="noopener">'+E(a[0])+' ↗</a><small>'+E(a[1])+'</small></div><div class="actions"><span class="apb" style="--c:'+k[1]+'">'+k[0]+'</span>'+(a[4]?'<button class="secondary" data-ax="try" data-d="'+a[4]+'">Try it</button>':'')+'<button class="secondary" data-ax="star" data-n="'+E(a[0])+'" aria-label="Star '+E(a[0])+'" aria-pressed="'+on+'">'+(on?'★':'☆')+'</button></div></div>'}).join("")+'</div>'});
 return out||'<div class="panel"><p class="muted">No APIs match your search.</p></div>'}
function demoHTML(){
 const d=DEMOS[S.demo];
 return'<div class="panel"><div class="eyebrow">Live playground</div><h2 style="margin-top:8px">Try an API right here</h2><p class="muted" style="font-size:13px">These run directly in your browser. No API key needed.</p><div class="tabs">'+Object.keys(DEMOS).map(k=>'<button class="tab'+(k===S.demo?' on':'')+'" data-ax="demo" data-d="'+k+'">'+DEMOS[k].l+'</button>').join("")+'</div><form id="apForm" class="ap-in">'+(d.noin?'':'<input type="text" id="apIn" value="'+E(d.d)+'" placeholder="'+E(d.ph)+'" autocomplete="off" aria-label="'+E(d.l)+' input">')+'<button class="primary" type="submit">Run</button></form><p class="status" style="margin-top:10px">Powered by '+E(d.api)+'</p><div class="ap-out" id="apOut" aria-live="polite"></div></div>'}
async function run(){
 const d=DEMOS[S.demo],o=$i("apOut"),inp=$i("apIn"),v=inp?inp.value.trim():"";if(!o)return;if(!d.noin&&!v){o.innerHTML='<p class="muted">Type something first.</p>';return}
 const k=S.demo;o.innerHTML='<p class="muted">Loading…</p>';
 try{const h=await d.run(v);if(k===S.demo&&$i("apOut"))$i("apOut").innerHTML=h}
 catch(e){if(k===S.demo&&$i("apOut"))$i("apOut").innerHTML='<p class="muted">Could not get a result. Check the spelling or your connection and try again.</p>'}}
function bindDemo(){const f=$i("apForm");if(f)f.onsubmit=e=>{e.preventDefault();run()}}
function renderApis(app){
 const chips=[["all","All"],["star","★ Starred"]].concat(CATS.map(c=>[c.id,c.t.split(" &")[0]]));
 app.innerHTML='<div class="ap"><div class="topline"><div><div class="eyebrow">Lumen workspace</div><div class="status">Free APIs you can build with</div></div></div><h1>API Library</h1><p class="sub">A curated collection of free APIs for Lumen. Open the docs, star your favourites, or try the key-free ones live below.</p>'
 +'<div id="apDemoBox">'+demoHTML()+'</div>'
 +'<div class="panel"><input type="text" id="apSearch" class="ap-search" placeholder="Search APIs…" value="'+E(S.q)+'" autocomplete="off" aria-label="Search APIs"><div class="tabs" id="apChips" style="margin:12px 0 0;padding-bottom:4px">'+chips.map(c=>'<button class="tab'+(c[0]===S.cat?' on':'')+'" data-ax="cat" data-c="'+c[0]+'">'+E(c[1])+'</button>').join("")+'</div></div>'
 +'<div id="apList">'+list()+'</div></div>';
 bindDemo();
 app.onclick=e=>{const b=e.target.closest("[data-ax]");if(!b)return;const a=b.dataset.ax;
  if(a==="cat"){S.cat=b.dataset.c;app.querySelectorAll("#apChips .tab").forEach(x=>x.classList.toggle("on",x.dataset.c===S.cat));$i("apList").innerHTML=list()}
  else if(a==="star"){const n=b.dataset.n,k=S.star.indexOf(n);k>-1?S.star.splice(k,1):S.star.push(n);ls.set("lumen_api_star",S.star);$i("apList").innerHTML=list()}
  else if(a==="demo"||a==="try"){S.demo=b.dataset.d;$i("apDemoBox").innerHTML=demoHTML();bindDemo();if(a==="try"){$i("apDemoBox").scrollIntoView({behavior:"smooth",block:"start"});run()}}};
 app.oninput=e=>{if(e.target.id==="apSearch"){S.q=e.target.value;$i("apList").innerHTML=list()}};
}
const _r=render;
render=function(){
 const app=$i("app");
 if(view==="apis"){app.onclick=app.oninput=app.onchange=null;clTeardown();document.body.classList.remove("labmode");
  document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===view));
  renderApis(app);$i("main").scrollTop=0;return}
 _r()};
const css=document.createElement("style");
css.textContent=".ap{animation:appear .3s ease both}.ap input[type=text]{width:100%;background:#ffffff0d;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;outline:none}.ap input[type=text]:focus{border-color:var(--accent)}.ap-in{display:flex;gap:8px;flex-wrap:wrap}.ap-in input{flex:1 1 200px;width:auto!important}.ap-out{margin-top:14px;min-height:20px;overflow-wrap:anywhere}.ap-row{flex-wrap:wrap}.ap-row>div:first-child{flex:1 1 240px}.apb{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;border:1px solid var(--c);color:var(--c);background:#ffffff08;white-space:nowrap}";
document.head.appendChild(css);
})();
</script>
