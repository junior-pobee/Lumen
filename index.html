<style>
:root{color-scheme:dark;--bg:#06070d;--ink:#f8f9ff;--muted:#a0aac1;--line:#ffffff19;--accent:#9acbff;--glass:#ffffff09;--radius:22px}
*{box-sizing:border-box;margin:0}
html{width:100%;height:100%;overflow:hidden}
body{width:100%;height:100vh;height:100dvh;min-height:0;overflow:hidden;display:flex;background:var(--bg);color:var(--ink);font:15px/1.6 Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
.orb{position:fixed;z-index:-1;pointer-events:none;border-radius:50%;filter:blur(100px);opacity:.35}
.orb1{width:48vw;height:48vw;top:-20vw;left:-20vw;background:#1648d2}
.orb2{width:42vw;height:42vw;right:-20vw;bottom:-20vw;background:#7025bc}
.orb3{width:30vw;height:30vw;left:30%;top:35%;background:#087e9b;opacity:.18}

/* ===== Lumen Loading Screen Overlay ===== */
#lumen-loading-screen{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#06070d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:opacity 0.6s ease, visibility 0.6s ease;
  padding:20px;
}
#lumen-loading-screen.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
.ls-logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:.3em;
  color:#fff;
  margin-bottom:24px;
}
.ls-logo span{color:var(--accent)}
.ls-spinner-container{
  position:relative;
  width:80px;
  height:80px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:28px;
}
.ls-spinner-ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:3px solid transparent;
  border-top-color:var(--accent);
  border-right-color:rgba(154,203,255,0.3);
  animation:ls-spin 1.2s linear infinite;
}
.ls-spinner-core{
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 20px var(--accent);
  animation:ls-pulse 1.8s ease-in-out infinite alternate;
}
.ls-progress-bar-bg{
  width:100%;
  max-width:260px;
  height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:999px;
  overflow:hidden;
  margin-bottom:12px;
}
.ls-progress-bar-fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#1648d2,var(--accent));
  border-radius:999px;
  transition:width 0.1s linear;
}
.ls-status-text{
  font-size:12px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:700;
  height:18px;
}
.ls-credit{
  margin-top:20px;
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#70809b;
  font-weight:600;
  opacity:0.85;
}
@keyframes ls-spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes ls-pulse{0%{transform:scale(0.7);opacity:0.5}100%{transform:scale(1.1);opacity:1}}

nav{width:250px;flex:0 0 250px;min-height:0;min-width:0;margin:14px;padding:22px 13px;border:1px solid var(--line);border-radius:var(--radius);background:#0c1124e8;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;flex-direction:column;gap:7px;overflow-y:auto;overscroll-behavior:contain}
.logo{padding:0 12px 24px;font-size:23px;font-weight:900;letter-spacing:.3em;flex-shrink:0}
.logo span{color:var(--accent)}
nav button{border:1px solid transparent;border-radius:14px;padding:12px;background:transparent;color:var(--muted);font-weight:700;text-align:left;display:flex;align-items:center;gap:12px}
nav button:hover,nav button.on{background:#ffffff10;border-color:var(--line);color:#fff}
.navbottom{margin-top:auto;display:grid;gap:7px;padding-top:14px}
main{position:relative;flex:1 1 0;min-width:0;min-height:0;height:100%;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:30px clamp(14px,4vw,54px) 60px}
.wrap{width:100%;max-width:1100px;min-height:0;margin:0 auto}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}
.eyebrow{font-size:11px;letter-spacing:.2em;color:var(--accent);font-weight:900;text-transform:uppercase}
.status{font-size:12px;color:var(--muted)}
h1{font-size:clamp(32px,5vw,58px);line-height:1.08;letter-spacing:-.045em;font-weight:900;overflow-wrap:anywhere}
h2{font-size:23px;line-height:1.25;margin-bottom:12px;overflow-wrap:anywhere}
h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin:20px 0 10px}
p{overflow-wrap:anywhere}
.sub{color:var(--muted);margin:13px 0 23px;max-width:760px}
.panel{min-width:0;border:1px solid var(--line);background:var(--glass);border-radius:var(--radius);padding:22px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:inset 0 1px #ffffff0b,0 20px 65px -35px #000;margin-bottom:16px;animation:appear .25s ease both}
@keyframes appear{from{opacity:0;transform:translateY(7px)}}
.searchbar{display:flex;align-items:center;gap:8px;min-width:0;padding:7px 8px 7px 18px;border:1px solid var(--line);border-radius:999px;background:#080a13dc;box-shadow:0 0 45px -25px var(--accent)}
.searchbar:focus-within{border-color:var(--accent)}
.searchbar input{min-width:0;flex:1;background:none;border:0;outline:none;padding:10px 0;font-size:16px}
.primary,.secondary,.chip,.tab{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:999px;padding:10px 15px;font-weight:800;text-decoration:none;transition:background .2s,border-color .2s}
.primary{border:0;background:#fff;color:#090b13;padding:12px 21px}
.primary:hover{background:#dcecff}
.secondary,.chip,.tab{background:#ffffff0b;color:var(--muted)}
.tabs .tab{background:#c0c0c0;border-color:#e5e5e5;color:#111;transition:background .35s,color .35s,border-color .35s}
.tabs .tab:hover{background:#d4d4d4}
.tabs .tab.on{background:#000;border-color:#fff;color:#fff;animation:tabtoblack .4s ease-out}
@keyframes tabtoblack{from{background:#c0c0c0;color:#111;border-color:#e5e5e5}to{background:#000;color:#fff;border-color:#fff}}
.panel.empty{background:#f97316;border-color:#fdba74;color:#fff}
.panel.empty h2{color:#fff;font-weight:900;font-size:27px;text-shadow:0 2px 10px #00000066}
.panel.empty p{color:#fff;font-weight:600;text-shadow:0 1px 6px #00000055}
.panel.empty div{color:#fff;text-shadow:0 2px 10px #00000066}
.secondary:hover,.chip:hover,.tab:hover,.tab.on{color:#fff;border-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.suggestions .chip{font-size:12px;padding:5px 10px;border-radius:0}
.tabs{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;padding:7px 1px 17px;margin-bottom:8px}
.tab{flex-shrink:0;white-space:nowrap;font-size:13px}
.tab.on{background:#8fc3ff20;color:var(--accent)}
.word{font-size:clamp(25px,4vw,40px);font-weight:900;line-height:1.15;letter-spacing:-.03em;overflow-wrap:anywhere}
.answer{margin-top:17px;color:#e1e6f1;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;font-size:15px}
.muted{color:var(--muted)}
.hero{display:block;width:100%;max-height:370px;object-fit:cover;border-radius:16px;margin:0 0 18px;background:#111522}
.image-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:18px 0}
.image-preview a{min-width:0;display:block}
.image-preview img{display:block;width:100%;height:145px;object-fit:cover;border-radius:13px;border:1px solid var(--line);background:#111522}
.image-preview a:hover img{border-color:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(155px,100%),1fr));gap:13px}
.gallery a{display:block;min-width:0;color:var(--muted);text-decoration:none;font-size:12px;overflow-wrap:anywhere}
.gallery img{display:block;width:100%;height:170px;object-fit:cover;border-radius:13px;border:1px solid var(--line);background:#111522}
.gallery a:hover img{border-color:var(--accent)}
.result{display:flex;gap:13px;min-width:0;padding:14px 0;border-bottom:1px solid var(--line)}
.result:last-child{border-bottom:0}
.result>div{min-width:0;flex:1}
.result img{width:94px;height:82px;object-fit:cover;border-radius:12px;flex-shrink:0}
.result a,.link{color:var(--accent);text-decoration:none;font-weight:800;overflow-wrap:anywhere}
.result a:hover,.link:hover{text-decoration:underline}
.result p{font-size:13px;color:var(--muted);margin-top:5px}
.empty{text-align:center;padding:42px 12px;color:var(--muted)}
.loading{height:12px;margin:15px 0;border-radius:99px;background:linear-gradient(90deg,#ffffff08,#ffffff20,#ffffff08);background-size:200% 100%;animation:shine 1.2s infinite}
@keyframes shine{to{background-position:-200% 0}}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row>div:first-child{min-width:0;overflow-wrap:anywhere}
.row strong{display:block;overflow-wrap:anywhere}
.row small{display:block;color:var(--muted);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:14px}
.cardlink{color:inherit;text-decoration:none}
.cardlink:hover{border-color:var(--accent)}
textarea,input,select{width:100%;border:1px solid var(--line);border-radius:12px;background:#0006;padding:12px;outline:none}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#000b;backdrop-filter:blur(12px);overflow-y:auto}
.modal.on{display:flex}
.dialog{width:min(430px,100%);max-height:90%;overflow-y:auto;border:1px solid var(--line);border-radius:22px;padding:25px;background:#121629}
.dialog input{margin:12px 0}
.toast{position:fixed;z-index:30;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#20283a;border:1px solid var(--line);border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px}
.editors{display:grid;gap:12px;min-width:0}
.editorbox{min-width:0;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#090b12}
.editorhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 13px;background:#ffffff09;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.1em}
.editorbox textarea{display:block;min-height:160px;resize:vertical;border:0;border-radius:0;background:#080a10;font:13px/1.65 monospace;tab-size:2}
.preview{display:block;width:100%;height:570px;border:1px solid var(--line);border-radius:15px;background:#fff}
.labtoolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px}
@media(max-width:800px){
body{flex-direction:column-reverse;height:100vh;height:100dvh;min-height:0;overflow:hidden}
nav{width:auto;flex:0 0 auto;min-height:0;max-height:none;overflow:visible;margin:0 9px calc(7px + env(safe-area-inset-bottom));padding:6px;flex-direction:row;justify-content:space-around;border-radius:19px;gap:2px}
.logo,.navbottom{display:none}
nav button{flex:1 1 0;min-width:0;justify-content:center;flex-direction:column;gap:2px;padding:8px 2px;font-size:10px;text-align:center}
main{flex:1 1 0;width:100%;min-width:0;min-height:0;height:auto;overflow-x:hidden;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:21px 14px 35px}
.wrap{width:100%;min-height:0}
.topline{margin-bottom:23px}
.panel{padding:17px}
.lab{grid-template-columns:minmax(0,1fr)}
.preview{height:450px}
.image-preview img{height:110px}
.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
.gallery img{height:155px}
}
@media(max-width:380px){
nav button{font-size:9px}
.searchbar{padding-left:12px}
.searchbar input{font-size:14px}
.searchbar .primary{padding:10px 13px}
.actions{gap:6px}
.secondary{padding:8px 10px;font-size:12px}
.result img{width:72px;height:72px}
.image-preview img{height:90px}
}
/* ===== large screens: side menu with no card / bar ===== */
@media(min-width:801px){
nav{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
}

/* ===== Code Lab IDE (Spck-style) ===== */
body.labmode main{overflow:hidden;padding:10px;display:flex;flex-direction:column;touch-action:auto}
body.labmode .wrap{max-width:none;flex:1 1 0;min-height:0;height:auto}
.ide{position:relative;height:100%;display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:16px;background:#0a0c14;overflow:hidden;font-size:13px}
.ide button{font:inherit;color:inherit}
.ide-bar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#0e1120;border-bottom:1px solid var(--line);flex:0 0 auto}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:36px;height:36px;padding:0 10px;border:1px solid transparent;border-radius:10px;background:transparent;color:#cfd8ec;font-weight:700;white-space:nowrap;position:relative}
.ib:hover,.ib.on{background:#ffffff14;border-color:var(--line)}
.ib.run{background:#16a34a;color:#fff}
.ib.run:hover{background:#22c55e}
.ib.proj{max-width:46vw;min-width:0}
.ib.proj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ide-sp{flex:1}
.ide-save{font-size:11px;color:var(--muted);white-space:nowrap;padding:0 6px}
.ide-body{position:relative;flex:1 1 0;min-height:0;display:flex}
.ide-files,.ide-edit,.ide-prev{min-width:0;min-height:0;display:flex;flex-direction:column}
.ide-files{flex:0 0 232px;border-right:1px solid var(--line);background:#0c0f1a}
.ide-edit{flex:1 1 0;background:#080a10}
.ide-prev{flex:0 0 40%;border-left:1px solid var(--line);background:#0c0f1a}
.ide:not(.files-on) .ide-files{display:none}
.ide:not(.prev-on) .ide-prev{display:none}
.ide[data-mode=mid] .ide-files{position:absolute;z-index:6;left:0;top:0;bottom:0;width:min(280px,86%);box-shadow:14px 0 40px #000b}
.ide.maxprev[data-mode=wide] .ide-files,.ide.maxprev[data-mode=wide] .ide-edit,.ide.maxprev[data-mode=mid] .ide-edit{display:none}
.ide.maxprev[data-mode=wide] .ide-prev,.ide.maxprev[data-mode=mid] .ide-prev{display:flex;flex:1 1 0;border-left:0}
.ide[data-mode=narrow] .ide-files,.ide[data-mode=narrow] .ide-edit,.ide[data-mode=narrow] .ide-prev{flex:1 1 0;border:0;display:none;position:static;width:auto;box-shadow:none}
.ide[data-mode=narrow][data-pane=files] .ide-files{display:flex}
.ide[data-mode=narrow][data-pane=editor] .ide-edit{display:flex}
.ide[data-mode=narrow][data-pane=preview] .ide-prev{display:flex}
.ide[data-mode=narrow] .hide-n{display:none}
.cl-fhead{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.cl-fhead>span{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);padding-left:4px}
.cl-fact{display:flex;gap:4px;flex-wrap:wrap}
.cl-fb{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#ffffff0b;color:#dbe4f7;font-weight:700;font-size:12px}
.cl-fb:hover{background:#ffffff18}
.cl-tree{flex:1;overflow:auto;padding:6px 0;-webkit-overflow-scrolling:touch}
.cl-row{display:flex;align-items:center;gap:7px;min-height:36px;padding:2px 4px 2px 8px;cursor:pointer;color:#cbd5e8;white-space:nowrap;user-select:none}
.cl-row:hover{background:#ffffff0d}
.cl-row.on{background:#3b82f626;color:#fff}
.cl-row.sel{background:#ffffff10}
.cl-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cl-m{flex:0 0 auto;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:16px}
.cl-m:hover{background:#ffffff18;color:#fff}
.cl-none{padding:18px 14px;color:var(--muted);font-size:13px}

<script>
// ===== Loading Screen Script =====
(function initLoadingScreen(){
  const duration = 16000; // 16 seconds
  const startTime = Date.now();
  const fill = document.getElementById("ls-progress");
  const status = document.getElementById("ls-status");
  const screen = document.getElementById("lumen-loading-screen");
  
  const messages = [
    { time: 0, text: "Initializing environment…" },
    { time: 3600, text: "Connecting workspace…" },
    { time: 8000, text: "Loading Code Lab engine…" },
    { time: 12400, text: "Finalizing setups…" }
  ];

  function updateLoading(){
    const elapsed = Date.now() - startTime;
    const progress = Math.min(100, (elapsed / duration) * 100);
    
    if(fill) fill.style.width = progress + "%";
    
    // Update status text based on elapsed time
    for(let i = messages.length - 1; i >= 0; i--){
      if(elapsed >= messages[i].time){
        if(status && status.textContent !== messages[i].text){
          status.textContent = messages[i].text;
        }
        break;
      }
    }

    if(elapsed < duration){
      requestAnimationFrame(updateLoading);
    } else {
      if(fill) fill.style.width = "100%";
      if(status) status.textContent = "Ready";
      setTimeout(() => {
        if(screen) screen.classList.add("hidden");
      }, 300);
    }
  }
  requestAnimationFrame(updateLoading);
})();

const CONFIG={SEARCH_ENDPOINT:"",AI_ENDPOINT:"",RUN_ENDPOINT:"https://emkc.org/api/v2/piston/execute"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
let state={saved:[],projects:[]};
try{const old=JSON.parse(localStorage.getItem("lumen")||"{}");state.saved=Array.isArray(old.saved)?old.saved:[];state.projects=Array.isArray(old.projects)?old.projects:[]}catch(e){}
let view="search",tab="all",current=null,openProject=null,query="",busy=false;
const persist=()=>{try{localStorage.setItem("lumen",JSON.stringify(state))}catch(e){toast("Storage is full")}};
function toast(message){const t=$("#toast");t.textContent=message;t.classList.add("on");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("on"),2300)}
function safeURL(value){try{const u=new URL(value);return["https:","http:"].includes(u.protocol)?u.href:""}catch(e){return""}}
function cleanContent(value){
let text=String(value??"");
for(let i=0;i<3;i++){
text=text.replace(/<script\b[^>]*>[\s\S]*?<\/script\s*>/gi," ").replace(/<style\b[^>]*>[\s\S]*?<\/style\s*>/gi," ").replace(/<(br|\/p|\/div|\/li|\/h[1-6]|\/section|\/article)\b[^>]*>/gi,"\n").replace(/<[^>]*>/g," ");
const decoder=document.createElement("textarea");
decoder.innerHTML=text;
text=decoder.value;
}
return text.replace(/\r/g,"").replace(/[ \t]+\n/g,"\n").replace(/\n[ \t]+/g,"\n").replace(/\n{3,}/g,"\n\n").trim()
}
function cleanText(value){return cleanContent(value).replace(/\s+/g," ").trim()}
function cleanItem(item){
if(!item||typeof item!=="object")return item;
const out={...item};
for(const key of ["title","name","snippet","description","source","answer","extract","text","summary"]){
if(typeof out[key]==="string")out[key]=["answer","extract","text"].includes(key)?cleanContent(out[key]):cleanText(out[key])
}
if(typeof out.url==="string")out.url=safeURL(out.url)||"";
if(Array.isArray(out.results))out.results=out.results.map(cleanItem);
if(Array.isArray(out.items))out.items=out.items.map(cleanItem);
if(Array.isArray(out.images))out.images=out.images.map(cleanItem);
return out
}
function searchURL(q,mode="search"){
const p=new URLSearchParams({q});
if(mode==="images")p.set("tbm","isch");
if(mode==="videos")p.set("tbm","vid");
if(mode==="news")p.set("tbm","nws");
if(mode==="maps")return"https://www.google.com/maps/search/"+encodeURIComponent(q);
return"https://www.google.com/search?"+p.toString()
}
async function getJSON(url,options={}){
const r=await fetch(url,options);
if(!r.ok)throw Error("Request failed");
return r.json()
}
async function searchProvider(q,mode){
if(!CONFIG.SEARCH_ENDPOINT)return null;
return cleanItem(await getJSON(CONFIG.SEARCH_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,mode})}))
}
async function askAI(q,deep){
if(!CONFIG.AI_ENDPOINT)return null;
return cleanItem(await getJSON(CONFIG.AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,deep})}))
}
async function wikiSearch(q){
return getJSON("https://en.wikipedia.org/w/api.php?"+new URLSearchParams({action:"query",list:"search",srsearch:q,srlimit:"6",format:"json",origin:"*"}))
}
async function publicAnswer(q,deep){
const found=await wikiSearch(q);
const results=found.query?.search||[];
if(!results.length)return{title:q,empty:true,results:[]};
const normalized=q.toLowerCase().replace(/[?!.]+$/g,"").trim();
const exact=results.find(r=>r.title.toLowerCase()===normalized);
const phraseMatch=results.find(r=>r.title.toLowerCase().includes(normalized)||normalized.includes(r.title.toLowerCase()));
const best=exact||phraseMatch||results[0];
const articleURL=title=>"https://en.wikipedia.org/w/api.php?"+new URLSearchParams({action:"query",prop:"extracts",explaintext:"1",exchars:deep?24000:18000,exsectionformat:"plain",titles:title,redirects:"1",format:"json",origin:"*"});
let summary={};
try{summary=await getJSON("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(best.title))}catch(e){}
let answer="";
try{
const detail=await getJSON(articleURL(best.title));
const page=Object.values(detail.query?.pages||{})[0];
answer=page?.extract||""
}catch(e){}
if(!answer.trim())answer=summary.extract||"";
const related=results.filter(r=>r.title!==best.title).slice(0,5).map(r=>({title:cleanText(r.title),snippet:cleanText(r.snippet),url:"https://en.wikipedia.org/wiki/"+encodeURIComponent(r.title.replace(/ /g,"_"))}));
if(answer.trim().length<4500&&related.length){
const extra=[];
for(const item of related.slice(0,deep?3:2)){
try{
const detail=await getJSON(articleURL(item.title));
const page=Object.values(detail.query?.pages||{})[0];
const extract=cleanContent(page?.extract||"");
if(extract.length>450)extra.push({title:item.title,extract:extract.slice(0,deep?6500:4000)})
}catch(e){}
}
if(extra.length)answer=answer.trim()+"\n\nADDITIONAL RELATED CONTEXT\n\n"+extra.map(item=>item.title+"\n\n"+item.extract).join("\n\n────────────────────\n\n")
}
if(!answer.trim())answer="A detailed article could not be retrieved for this topic. Try a more specific search or open the web results to explore reliable sources.";
return cleanItem({title:best.title,description:summary.description||"",answer,hero:summary.originalimage?.source||summary.thumbnail?.source||"",source:"Wikipedia",sourceUrl:summary.content_urls?.desktop?.page||"https://en.wikipedia.org/wiki/"+encodeURIComponent(best.title.replace(/ /g,"_")),results,images:[]})
}
async function imageSearch(q){
const data=await getJSON("https://commons.wikimedia.org/w/api.php?"+new URLSearchParams({action:"query",generator:"search",gsrsearch:q,gsrnamespace:"6",gsrlimit:"50",prop:"imageinfo",iiprop:"url|extmetadata",iiurlwidth:"600",format:"json",origin:"*"}));
return Object.values(data.query?.pages||{}).map(p=>({title:cleanText(p.title.replace(/^File:/,"")),src:p.imageinfo?.[0]?.thumburl||p.imageinfo?.[0]?.url||"",url:p.imageinfo?.[0]?.descriptionurl||"",description:cleanText(p.imageinfo?.[0]?.extmetadata?.ImageDescription?.value||"")})).filter(i=>i.src&&safeURL(i.src))
}

async function performSearch(q){
if(!q||busy)return;
query=q;
tab="all";
view=view==="research"?"research":"search";
busy=true;
current={loading:true};
render();
try{
let result=await searchProvider(q,"all");
if(!result){
const ai=await askAI(q,view==="research");
result=ai||await publicAnswer(q,view==="research")
}
if(!result||typeof result!=="object")throw Error("Invalid response");
result=cleanItem(result);
if(!result.title)result.title=q;
if(!result.results)result.results=[];
current=result;
current.images=[];
current.imagesLoading=false;
current.imagesError=false;
try{current.images=(await imageSearch(q)).slice(0,3)}catch(e){current.images=[]}
if(!current.empty&&!current.answer&&!current.results.length)current.empty=true
}catch(e){
current={error:"No reliable answer could be retrieved. Check your connection or try another search.",title:q,images:[]}
}finally{
busy=false;
render()
}
}
async function changeTab(next){
tab=next;
render();
if(!query||!current||current.loading)return;
if(next==="images"){
if(current.imagesLoading)return;
current.imagesLoading=true;
current.imagesError=false;
render();
try{
const response=await searchProvider(query,"images");
const images=response?.images||await imageSearch(query);
current.images=images.map(cleanItem);
current.imagesError=!current.images.length
}catch(e){
current.imagesError=true;
toast("Images could not be loaded. Please try again.")
}finally{
current.imagesLoading=false;
render()
}
}else if(["videos","news","maps"].includes(next)){
try{
const response=await searchProvider(query,next);
if(response)current.categoryResults=cleanItem(response)
}catch(e){toast("Live results are unavailable from the connected provider.")}
render()
}
}

function hl(src,rules,flags){
const re=new RegExp(rules.map(r=>"("+r[0]+")").join("|"),flags||"g");
let out="",last=0,m;
while((m=re.exec(src))!==null){
if(m[0]===""){re.lastIndex++;continue}
out+=esc(src.slice(last,m.index));
let g=1;while(g<=rules.length&&m[g]===undefined)g++;
const c=rules[g-1][1];
out+=c?'<span class="'+c+'">'+esc(m[0])+"</span>":esc(m[0]);
last=re.lastIndex
}
return out+esc(src.slice(last))
}

function hlHTML(src){

const LANG_NAMES={html:"HTML",htm:"HTML",css:"CSS",scss:"SCSS",less:"Less",js:"JavaScript",mjs:"JavaScript",ts:"TypeScript",tsx:"TSX",jsx:"JSX",json:"JSON",md:"Markdown",svg:"SVG",txt:"Text",xml:"XML",py:"Python",java:"Java",c:"C",h:"C header",cpp:"C++",cc:"C++",hpp:"C++ header",cs:"C#",go:"Go",rs:"Rust",kt:"Kotlin",swift:"Swift",dart:"Dart",scala:"Scala",rb:"Ruby",sh:"Shell",bash:"Shell",php:"PHP",sql:"SQL",lua:"Lua",r:"R",pl:"Perl",yml:"YAML",yaml:"YAML",toml:"TOML",ini:"INI"};

function langRules(ext){

}

function clIndent(ta){

function clOutdent(ta){
const s=ta.selectionStart,e=ta.selectionEnd,v=ta.value;

}

}

function clFindNext(dir){

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zipBlob(entries){

const ch=new DataView(new ArrayBuffer(46));
ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);

async function inflateRaw(u8){

}
async function clReadZip(file){

for(let i=buf.length-22;i>=Math.max(0,buf.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}

}
function clStripRoot(entries){

if(entries.every(x=>x.name.split("/")[0]===first))return entries.map(x=>({...x,name:x.name.slice(first.length+1)}))

}
function clImportEntries(p,entries,prefix){
let added=0,replaced=0;
const dec=new TextDecoder();
for(const en of entries){
const path=normPath((prefix?prefix+"/":"")+en.name);
if(!path||badName(path))continue;
const text=TEXT_EXT.has(extOf(path));
const rec={path,content:text?dec.decode(en.bytes):"data:"+mimeOf(path)+";base64,"+bytesToB64(en.bytes),bin:!text};
const ex=p.files.find(f=>f.path===path);
if(ex){ex.content=rec.content;ex.bin=rec.bin;replaced++}else{p.files.push(rec);added++}
}
return{added,replaced}
}

async function clUpload(files){

for(const file of files){

}
const ext=extOf(file.name);
const path=normPath((clSelDirV?clSelDirV+"/":"")+file.name);
if(badName(path))continue;
let rec;
if(TEXT_EXT.has(ext)||/^text\//.test(file.type)||/json|javascript|xml/.test(file.type))rec={path,content:await file.text(),bin:false};
else{
if(file.size>15*1024*1024){toast(file.name+" is too large (max 15 MB)");continue}
rec={path,content:await blobToDataURL(file),bin:true}
}
const ex=p.files.find(f=>f.path===path);

}catch(err){toast(String(err.message||err))}

}

if(base&&f.path.startsWith(base+"/"))lf[f.path.slice(base.length+1)]=f.content
}
const fetchShim='window.__LF='+JSON.stringify(lf).replace(/</g,"\\u003c")+';(function(){var F=window.fetch;if(!F)return;window.fetch=function(u){try{var s=(typeof u==="string"?u:u.url).split("#")[0].split("?")[0];while(s.indexOf("./")===0)s=s.slice(2);while(s.charAt(0)==="/")s=s.slice(1);if(window.__LF&&Object.prototype.hasOwnProperty.call(window.__LF,s))return Promise.resolve(new Response(window.__LF[s],{status:200,headers:{"Content-Type":s.slice(-5)===".json"?"application/json":"text/plain"}}))}catch(e){}return F.apply(this,arguments)}})();';
const shim="<script>"+CL_STORAGE_SHIM+";"+(bridge?CL_BRIDGE:"")+fetchShim+"<\/script>";
if(/<head\b[^>]*>/i.test(html))html=html.replace(/<head\b[^>]*>/i,m=>m+shim);
else if(/<html\b[^>]*>/i.test(html))html=html.replace(/<html\b[^>]*>/i,m=>m+"<head>"+shim+"</head>");
else html='<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+shim+html;
return html
}

const CL_PY_DOC='<!doctype html><html><head><script>'+CL_STORAGE_SHIM+';'+CL_BRIDGE+'<\/script><script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"><\/script></head><body><script>'
+'var py=null;async function init(){if(typeof loadPyodide!=="function")throw new Error("Python could not be loaded. Connect to the internet and try again (needed the first time).");console.log("Loading Python (first run takes a few seconds)…");py=await loadPyodide();py.setStdout({batched:function(s){console.log(s)}});py.setStderr({batched:function(s){console.error(s)}})}'
+'async function run(d){try{if(!py)await init();for(var n in d.files){var i=n.lastIndexOf("/");if(i>0)py.FS.mkdirTree(n.slice(0,i));py.FS.writeFile(n,d.files[n])}await py.runPythonAsync(d.main);console.log("[finished]")}catch(e){console.error(String(e&&e.message||e))}}'
+'addEventListener("message",function(e){if(e.data&&e.data.lumenPy)run(e.data.lumenPy)});parent.postMessage({lumenReady:1},"*");'
+'<\/script></body></html>';
function clRunActive(){
const p=clP(),f=clF(p.active),kind=f&&!f.bin?clRunKind(f.path,p):null;
if(kind)clRunCode(f,kind);else clRun(true)
}
async function clRunCode(f,kind){
const p=clP(),rn=$("#clrunner");if(!rn)return;
clUI.con=true;const con=$("#clcon");if(con)con.classList.add("on");
if(clNarrow())clSetPane("preview",true);
clLogs=[{level:"cmd",text:"▶ Running "+f.path+(kind==="online"?" (online runner)":"")+"…"}];clRenderLogs();
if(kind==="js"){
clRunnerKind="js";clRunnerReady=false;
rn.srcdoc='<!doctype html><html><head><script>'+CL_STORAGE_SHIM+';'+CL_BRIDGE+'<\/script></head><body><script>'+f.content.replace(/<\/script/gi,"<\\/script")+'\n<\/script></body></html>';
return
}
if(kind==="py"){
const files={};for(const x of p.files){if(!x.bin&&extOf(x.path)==="py")files[x.path]=x.content}
const job={files,main:f.content};
if(clRunnerKind==="py"&&clRunnerReady)rn.contentWindow.postMessage({lumenPy:job},"*");
else{clRunnerKind="py";clRunnerReady=false;clPyJob=job;rn.srcdoc=CL_PY_DOC}
return
}
try{
let ok=false;try{ok=localStorage.getItem("lumen-run-consent")==="1"}catch(e){}
if(!ok){
if(!confirm("This language runs on an online code runner ("+CONFIG.RUN_ENDPOINT.replace(/^https?:\/\//,"").split("/")[0]+"). Your code is sent to that service to be executed. Continue?")){clLogs.push({level:"warn",text:"Cancelled."});clRenderLogs();return}
try{localStorage.setItem("lumen-run-consent","1")}catch(e){}
}
const r=await fetch(CONFIG.RUN_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({language:PISTON[extOf(f.path)],version:"*",files:[{name:baseOf(f.path),content:f.content}]})});
if(!r.ok)throw new Error("the runner answered with status "+r.status);
const d=await r.json();
if(d.message)throw new Error(d.message);
const add=(level,t)=>{if(t)String(t).replace(/\n$/,"").split("\n").forEach(l=>clLogs.push({level,text:l}))};
if(d.compile){add("error",d.compile.stderr);if(d.compile.stdout&&!d.compile.stderr)add("info",d.compile.stdout)}
if(d.run){add("log",d.run.stdout);add("error",d.run.stderr);clLogs.push({level:"info",text:"[exited with code "+(d.run.code??0)+"]"})}
clRenderLogs()
}catch(err){
clLogs.push({level:"error",text:"Couldn't run this online ("+(err.message||err)+"). Check your internet connection, or set your own runner in CONFIG.RUN_ENDPOINT."});clRenderLogs()
}
}
function clFillSel(){
const sel=$("#clsel");if(!sel)return;
const p=clP(),pages=p.files.filter(f=>isHtmlPath(f.path)).map(f=>f.path),cur=clEntry(p);
sel.innerHTML=pages.length?pages.map(x=>`<option value="${esc(x)}"${x===cur?" selected":""}>${esc(x)}</option>`).join(""):`<option value="">No HTML file</option>`
}
function clRun(force){
const frame=$("#clframe");if(!frame)return;
const p=clP(),entry=clEntry(p);
clearTimeout(clPvTimer);
if(!entry){
frame.srcdoc='<!doctype html><body style="margin:0;display:grid;place-items:center;height:100vh;font:15px Arial,sans-serif;color:#667;background:#f4f6fb;text-align:center;padding:20px"><div>No HTML file to preview yet.<br>Create <b>index.html</b> to get started.</div></body>';
return
}
clPvPath=entry;clFillSel();
clLogs=[];clRenderLogs();
frame.srcdoc=clBuildDoc(p,entry,true);
if(force&&clNarrow()&&clUI.pane!=="preview")clSetPane("preview",true)
}
function clPreviewVisible(){
const ide=$("#ide");if(!ide)return false;
if(ide.dataset.mode==="narrow")return clUI.pane==="preview";
return clUI.prev!==false
}
function clLiveRun(){
if(!clUI.live||!clPreviewVisible())return;
clearTimeout(clPvTimer);clPvTimer=setTimeout(()=>clRun(false),650)
}
function clRenderLogs(){
const el=$("#cllog");if(!el)return;
el.innerHTML=clLogs.map(l=>`<div class="lg lg-${l.level}">${esc(l.text)}</div>`).join("");
el.scrollTop=el.scrollHeight;
const b=$("#clconbadge"),errs=clLogs.filter(l=>l.level==="error").length;
if(b){b.textContent=errs||"";b.style.display=errs?"block":"none"}
}
addEventListener("message",e=>{
const fr=document.getElementById("clframe"),rn=document.getElementById("clrunner");
const fromFr=!!fr&&e.source===fr.contentWindow,fromRn=!!rn&&e.source===rn.contentWindow;
if(!fromFr&&!fromRn)return;
const d=e.data||{};
if(d.lumenReady){if(fromRn){clRunnerReady=true;if(clPyJob){rn.contentWindow.postMessage({lumenPy:clPyJob},"*");clPyJob=null}}return}
if(d.lumenConsole){
if(d.lumenConsole.level==="clear")clLogs=[];
else{clLogs.push(d.lumenConsole);if(clLogs.length>300)clLogs.shift()}
clRenderLogs()
}else if(fromFr&&typeof d.lumenNav==="string"){
const t=resolvePath(dirOf(clPvPath||""),d.lumenNav.split(/[?#]/)[0]);
if(clF(t)&&isHtmlPath(t)){clPvPath=t;clRun(false)}
else{clLogs.push({level:"error",text:"Page not found: "+d.lumenNav});clRenderLogs()}
}
});
function clOpenBrowser(path){
const p=clP(),entry=path&&isHtmlPath(path)?path:clEntry(p);
if(!entry){toast("Create an HTML file first");return}
const url=URL.createObjectURL(new Blob([clBuildDoc(p,entry,false)],{type:"text/html"}));
const w=window.open(url,"_blank");
if(!w)toast("Allow pop-ups to open the browser tab");
setTimeout(()=>URL.revokeObjectURL(url),180000)
}
function clDownloadHTML(){
const p=clP(),entry=clEntry(p);
if(!entry){toast("Create an HTML file first");return}
clSaveBlob(new Blob([clBuildDoc(p,entry,false)],{type:"text/html"}),(baseOf(entry)||"index.html"))
}

function clPrompt(title,value,label,cb,hint){
clModalCb=cb;
showModal(`<h2>${esc(title)}</h2>${hint?`<p class="muted" style="font-size:13px">${esc(hint)}</p>`:""}<input id="clinput" value="${esc(value||"")}" autocomplete="off" spellcheck="false" autocapitalize="off"><div class="actions" style="justify-content:flex-end;margin-top:6px"><button class="secondary" data-cl="mcancel">Cancel</button><button class="primary" data-cl="mok">${esc(label||"OK")}</button></div>`);
setTimeout(()=>{const i=$("#clinput");if(i){i.focus();const n=i.value.length;i.setSelectionRange(n,n)}},60)
}
function clMenu(title,items){
showModal(`<h2 style="font-size:19px">${esc(title)}</h2><div class="cl-menu">${items.map(i=>`<button class="${i.danger?"danger":""}${i.cur?" cur":""}" data-cl="${i.cl||"mact"}" data-do="${i.do||""}" data-path="${esc(i.path||"")}" data-kind="${i.kind||""}">${i.icon?`<span>${i.icon}</span>`:""}${esc(i.label)}</button>`).join("")}</div>`)
}
function clProjectsModal(){
clMenu("Projects",[...cl.projects.map(x=>({label:x.name,cl:"pick",path:x.id,cur:x.id===cl.current,icon:"📂"})),{label:"New project",do:"newproj",icon:"＋"},{label:"Import ZIP as new project",do:"impzip",icon:"⇪"}])
}

clMenu(clP().name,[

{label:"New folder",do:"newfolderIn",path:d,icon:"📁"},

switch(act){
case"rename":clRename(path,kind);break;
case"delete":clDelete(path,kind);break;
case"dup":clDupFile(path);break;
case"dl":clDownloadFile(path);break;
case"obrowser":clOpenBrowser(path);break;
case"setprev":clPvPath=path;clFillSel();clRun(true);if(clNarrow())clSetPane("preview",true);break;
case"newfileIn":clNewFile(path);break;
case"newfolderIn":clNewFolder(path);break;
case"uploadIn":clSelDirV=path||"";$("#clupload").click();break;
case"newproj":clNewProject();break;
case"impzip":$("#clzip").click();break;
case"find":if(clNarrow())clSetPane("editor");clToggleFind(true);break;
case"zip":clExportZip();break;
case"dlhtml":clDownloadHTML();break;
case"live":clUI.live=!clUI.live;toast("Live preview "+(clUI.live?"on":"off"));break;

case"dupproj":{
const src=clP(),copy=JSON.parse(JSON.stringify(src));
copy.id=uid();copy.name=src.name+" copy";copy.created=copy.updated=Date.now();
cl.projects.unshift(copy);cl.current=copy.id;clPvPath=null;clChanged();render();toast("Project duplicated");break
}

cl.projects=cl.projects.filter(x=>x.id!==cl.current);

}

function clClick(e){

break;

case"projects":clProjectsModal();break;

case"run":clRunActive();break;
case"openbrowser":clOpenBrowser();break;
case"menu":clMainMenu();break;
case"dir":{const p=clP();p.expanded[path]=p.expanded[path]===false;clSelDirV=path;clChanged();clRenderFiles();break}
case"open":clOpen(path);break;
case"fmenu":clFileMenu(path,t.dataset.kind);break;
case"newfile":clNewFile();break;
case"newfolder":clNewFolder();break;
case"upload":$("#clupload").click();break;
case"tab":clOpen(path);break;
case"closetab":clCloseTab(path);break;
case"key":clKeyPress(t.dataset.k);break;
case"pane":clSetPane(t.dataset.p);break;
case"reload":clRun(true);break;
case"pvw":{clUI.w=clUI.w==="fit"?"375":clUI.w==="375"?"768":"fit";$("#clpv").dataset.w=clUI.w;toast(clUI.w==="fit"?"Preview: full width":"Preview: "+clUI.w+"px wide");break}
case"console":clUI.con=!clUI.con;$("#clcon").classList.toggle("on",clUI.con);break;
case"clearcon":clLogs=[];clRenderLogs();break;
case"maxprev":clUI.maxprev=!clUI.maxprev;clResize();break;
case"fprev":clFindNext(-1);break;
case"fnext":clFindNext(1);break;
case"frep":clReplace(false);break;
case"fall":clReplace(true);break;

case"mcancel":closeModal();break;
case"mok":{const i=$("#clinput"),v=i?i.value:"",cb=clModalCb;closeModal();clModalCb=null;if(cb)cb(v);break}
case"mact":clModalAction(t.dataset.do,path,t.dataset.kind);break
}
}

{t:"Lists and tables",sum:"Ordered, unordered lists and data tables",
body:`<p>Use <code>&lt;ul&gt;</code> for bullet lists, <code>&lt;ol&gt;</code> for numbered lists, and <code>&lt;li&gt;</code> for each item.</p><p>Tables show data in rows and columns: <code>&lt;table&gt;</code> contains rows <code>&lt;tr&gt;</code>, which contain header cells <code>&lt;th&gt;</code> and data cells <code>&lt;td&gt;</code>.</p>`,
code:`<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8"><title>Lists and tables</title>\n  <style>table{border-collapse:collapse}th,td{border:1px solid #888;padding:6px 12px}</style>\n</head>\n<body>\n  <h2>Shopping list</h2>\n  <ul><li>Rice</li><li>Tomatoes</li><li>Onions</li></ul>\n  <h2>Steps</h2>\n  <ol><li>Wash</li><li>Chop</li><li>Cook</li></ol>\n  <h2>Scores</h2>\n  <table>\n    <tr><th>Name</th><th>Score</th></tr>\n    <tr><td>Ama</td><td>92</td></tr>\n    <tr><td>Kofi</td><td>85</td></tr>\n  </table>\n</body>\n</html>\n`,
task:"Add a third row to the table and a fourth item to the shopping list."},
{t:"Forms and inputs",sum:"Collecting information from users",
body:`<p>Forms collect input. The <code>&lt;form&gt;</code> tag wraps fields such as <code>&lt;input&gt;</code>, <code>&lt;select&gt;</code> and <code>&lt;textarea&gt;</code>. Every field needs a <code>&lt;label&gt;</code> so it is clear (and accessible).</p><p>Useful input types: <code>text</code>, <code>email</code>, <code>number</code>, <code>password</code>, <code>checkbox</code>, <code>date</code>. The <code>required</code> attribute makes a field compulsory.</p>`,
code:`<!DOCTYPE html>\n<html lang="en">\n<head><meta charset="UTF-8"><title>Form</title>\n<style>label{display:block;margin-top:12px}input,select,textarea{padding:8px;width:260px}</style>\n</head>\n<body>\n  <h1>Contact me</h1>\n  <form onsubmit="event.preventDefault();document.getElementById('ok').textContent='Thanks, '+this.name.value+'!'">\n    <label for="name">Your name</label>\n    <input id="name" name="name" required>\n    <label for="email">Email</label>\n    <input id="email" type="email" required>\n    <label for="topic">Topic</label>\n    <select id="topic"><option>Question</option><option>Collaboration</option></select>\n    <label for="msg">Message</label>\n    <textarea id="msg" rows="3"></textarea>\n    <p><button type="submit">Send</button></p>\n  </form>\n  <p id="ok"></p>\n</body>\n</html>\n`,
task:"Add a number input labelled Age and a checkbox labelled Subscribe."},
{t:"Semantic layout",sum:"header, nav, main, section and footer",
body:`<p><b>Semantic</b> tags describe the <i>meaning</i> of each part of a page, which helps search engines, screen readers and other developers.</p><ul><li><code>&lt;header&gt;</code> – top of the page or a section</li><li><code>&lt;nav&gt;</code> – navigation links</li><li><code>&lt;main&gt;</code> – the main content (use once)</li><li><code>&lt;section&gt;</code> / <code>&lt;article&gt;</code> – grouped content</li><li><code>&lt;footer&gt;</code> – bottom of the page</li></ul>`,
code:`<!DOCTYPE html>\n<html lang="en">\n<head><meta charset="UTF-8"><title>Layout</title></head>\n<body>\n  <header>\n    <h1>My Blog</h1>\n    <nav><a href="#">Home</a> | <a href="#">About</a> | <a href="#">Contact</a></nav>\n  </header>\n  <main>\n    <article>\n      <h2>My first post</h2>\n      <p>Today I started learning HTML.</p>\n    </article>\n    <section>\n      <h2>Latest news</h2>\n      <p>More posts are coming soon.</p>\n    </section>\n  </main>\n  <footer><p>&copy; 2026 My Blog</p></footer>\n</body>\n</html>\n`,
task:"Add another article inside main with its own heading and paragraph."}
]},
{tag:"WEB",title:"Introduction to CSS",blurb:"Make pages beautiful: selectors, colours, the box model, flexbox and responsive design.",lessons:[
{t:"Selectors and properties",sum:"How CSS targets and styles elements",
body:`<p><b>CSS</b> (Cascading Style Sheets) controls how HTML looks. A rule has a <b>selector</b> (what to style) and <b>declarations</b> (how to style it):</p><p><code>p { color: blue; }</code></p><ul><li><code>p</code> – every paragraph (element selector)</li><li><code>.note</code> – every element with <code>class="note"</code></li><li><code>#title</code> – the one element with <code>id="title"</code></li></ul>`,
code:D(`  <h1 id="title">Styling with CSS</h1>\n  <p>A normal paragraph.</p>\n  <p class="note">A highlighted note.</p>`,``,`    body { font-family: Arial, sans-serif; padding: 20px; }\n    #title { color: #2563eb; }\n    p { line-height: 1.6; }\n    .note { background: #fef3c7; padding: 10px; border-left: 4px solid #f59e0b; }`),
task:"Make the title red and give the note a different background colour."},
{t:"Colours, text and fonts",sum:"Hex, rgb, hsl and typography",
body:`<p>Colours can be written as names (<code>tomato</code>), hex codes (<code>#ff6347</code>), <code>rgb(255,99,71)</code> or <code>hsl(9,100%,64%)</code>.</p><p>Text properties: <code>font-family</code>, <code>font-size</code>, <code>font-weight</code>, <code>text-align</code>, <code>letter-spacing</code> and <code>line-height</code> (use about 1.5 for easy reading).</p>`,
code:D(`  <h1>Typography</h1>\n  <p class="lead">Good text is easy to read.</p>\n  <p class="small">Small print goes here.</p>`,``,`    body { font-family: Georgia, serif; background: #0f172a; color: #e2e8f0; padding: 24px; }\n    h1 { color: hsl(200, 90%, 65%); letter-spacing: 2px; text-transform: uppercase; }\n    .lead { font-size: 22px; line-height: 1.6; }\n    .small { font-size: 13px; color: rgb(148, 163, 184); }`),
task:"Change the heading to a hex colour of your choice and centre all the text."},
{t:"The box model",sum:"Content, padding, border and margin",
body:`<p>Every element is a box made of four layers, from inside to outside:</p><ul><li><b>Content</b> – the text or image</li><li><b>Padding</b> – space inside the border</li><li><b>Border</b> – the edge of the box</li><li><b>Margin</b> – space outside the border</li></ul><p>Add <code>box-sizing: border-box;</code> so that padding and border are included in the width you set.</p>`,
code:D(`  <div class="box">I am a box</div>\n  <div class="box second">I am another box</div>`,``,`    * { box-sizing: border-box; }\n    body { font-family: Arial, sans-serif; padding: 20px; }\n    .box {\n      width: 260px;\n      padding: 20px;\n      border: 4px solid #2563eb;\n      margin: 16px 0;\n      background: #dbeafe;\n      border-radius: 12px;\n    }\n    .second { margin-left: 40px; border-style: dashed; }`),
task:"Increase the padding of the first box to 40px and see how the box grows."},
{t:"Flexbox layout",sum:"Rows, columns, spacing and alignment",
body:`<p><b>Flexbox</b> arranges items in a row or column. Put <code>display: flex</code> on the <i>parent</i> and the children line up automatically.</p><ul><li><code>gap</code> – space between items</li><li><code>justify-content</code> – spread items along the main axis</li><li><code>align-items</code> – align items on the other axis</li><li><code>flex-wrap: wrap</code> – let items move to the next line</li></ul>`,
code:D(`  <div class="row">\n    <div class="card">One</div>\n    <div class="card">Two</div>\n    <div class="card">Three</div>\n  </div>`,``,`    body { font-family: Arial, sans-serif; padding: 20px; }\n    .row {\n      display: flex;\n      gap: 16px;\n      justify-content: space-between;\n      align-items: center;\n      flex-wrap: wrap;\n    }\n    .card { flex: 1; min-width: 120px; padding: 30px; text-align: center; background: #e0e7ff; border-radius: 12px; }`),
task:"Change justify-content to center, then add a fourth card."},
{t:"Grid, responsive design and hover effects",sum:"Layouts that adapt to every screen",
body:`<p><b>CSS Grid</b> builds two-dimensional layouts. <code>repeat(auto-fit, minmax(160px, 1fr))</code> creates as many equal columns as will fit — a responsive layout with one line of CSS.</p><p>A <b>media query</b> applies styles only on certain screen sizes. <code>transition</code> makes changes smooth, for example on <code>:hover</code>.</p>`,
code:D(`  <div class="grid">\n    <div class="tile">A</div><div class="tile">B</div><div class="tile">C</div>\n    <div class="tile">D</div><div class="tile">E</div><div class="tile">F</div>\n  </div>`,``,`    body { font-family: Arial, sans-serif; padding: 20px; }\n    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }\n    .tile { padding: 28px; text-align: center; background: #2563eb; color: white; border-radius: 12px; transition: transform .25s, background .25s; }\n    .tile:hover { transform: translateY(-6px) scale(1.04); background: #1d4ed8; }\n    @media (max-width: 400px) { .tile { padding: 14px; } }`),
task:"Hover over a tile, then change the minmax value to 200px and watch the layout adapt."}
]},
{tag:"WEB",title:"Introduction to JavaScript",blurb:"Bring pages to life: values, arrays, objects, the DOM and events.",lessons:[
{t:"Hello, JavaScript",sum:"The console, strings and template literals",
body:`<p><b>JavaScript</b> makes web pages interactive. Use <code>console.log()</code> to print values while you learn — the console panel under the preview shows them.</p><p><b>Template literals</b> use backticks and let you insert values with <code>\${…}</code>, which is easier than joining text with <code>+</code>.</p>`,
code:D(`  <h1>Hello, JavaScript</h1>`,`    const name = "Ama";\n    const items = 3;\n    console.log("Hello, " + name);\n    console.log(\`\${name} has \${items} items, total \${items * 2.5} cedis\`);\n    console.log("shout".toUpperCase(), "Lumen".length);`),
task:"Add your own name and calculate a total using a different price."},
{t:"Arrays and objects",sum:"Lists and structured data",
body:`<p>An <b>array</b> is an ordered list: <code>["a","b","c"]</code>. Items are counted from <b>0</b>. Handy methods: <code>push</code>, <code>pop</code>, <code>length</code>.</p><p>An <b>object</b> groups related values using <i>keys</i>: <code>{ name: "Ama", age: 21 }</code>. Read a value with <code>person.name</code>.</p>`,
code:D(`  <h1>Arrays and objects</h1>`,`    const colours = ["red", "green", "blue"];\n    colours.push("gold");\n    console.log(colours[0], colours.length);\n\n    const person = { name: "Ama", age: 21, skills: ["HTML", "CSS"] };\n    person.age = 22;\n    person.skills.push("JavaScript");\n    console.log(person.name, person.age);\n    console.log(person.skills);\n\n    const students = [{ name: "Ama", score: 92 }, { name: "Kofi", score: 85 }];\n    for (const s of students) console.log(s.name + ": " + s.score);`),
task:"Add a third student and print their name and score."},
{t:"Functions and array methods",sum:"Arrow functions, map and filter",
body:`<p>Arrow functions are a shorter way to write functions: <code>const double = n =&gt; n * 2;</code></p><p>Arrays have powerful methods: <code>map</code> transforms every item, <code>filter</code> keeps items that pass a test, and <code>reduce</code> combines them into one value.</p>`,
code:D(`  <h1>Array methods</h1>`,`    const numbers = [1, 2, 3, 4, 5, 6];\n\n    const doubled = numbers.map(n => n * 2);\n    const evens = numbers.filter(n => n % 2 === 0);\n    const total = numbers.reduce((sum, n) => sum + n, 0);\n\n    console.log("doubled:", doubled);\n    console.log("evens:", evens);\n    console.log("total:", total);`),
task:"Use filter to keep only numbers greater than 3."},
{t:"The DOM",sum:"Selecting and changing page elements",
body:`<p>The <b>DOM</b> (Document Object Model) is the browser's live version of your HTML. JavaScript can find elements and change them.</p><ul><li><code>document.querySelector("#id")</code> – find an element</li><li><code>el.textContent = "…"</code> – change its text</li><li><code>el.style.color = "red"</code> – change its style</li><li><code>document.createElement("li")</code> – make a new element</li></ul>`,
code:D(`  <h1 id="title">Original title</h1>\n  <ul id="list"></ul>`,`    const title = document.querySelector("#title");\n    title.textContent = "Changed by JavaScript";\n    title.style.color = "#2563eb";\n\n    const list = document.querySelector("#list");\n    ["HTML", "CSS", "JavaScript"].forEach(topic => {\n      const li = document.createElement("li");\n      li.textContent = topic;\n      list.appendChild(li);\n    });`),
task:"Add 'Python' to the list of topics."},
{t:"Events",sum:"Responding to clicks and typing",
body:`<p>An <b>event</b> is something that happens: a click, a key press, a form submission. Use <code>addEventListener</code> to run a function when it happens.</p><p>Events turn static pages into apps: buttons, menus, games and forms all use them.</p>`,
code:D(`  <h1>Counter</h1>\n  <p>Count: <strong id="count">0</strong></p>\n  <button id="plus">+1</button>\n  <button id="reset">Reset</button>\n  <p><input id="name" placeholder="Type your name"></p>\n  <p id="hello"></p>`,`    let count = 0;\n    const show = document.querySelector("#count");\n\n    document.querySelector("#plus").addEventListener("click", () => {\n      count++;\n      show.textContent = count;\n      console.log("count is", count);\n    });\n    document.querySelector("#reset").addEventListener("click", () => {\n      count = 0;\n      show.textContent = count;\n    });\n    document.querySelector("#name").addEventListener("input", e => {\n      document.querySelector("#hello").textContent = "Hello, " + e.target.value + "!";\n    });`),
task:"Add a '-1' button that decreases the count."},
{t:"Putting it together",sum:"A tiny to-do app",
body:`<p>Now combine everything: HTML for structure, CSS for style and JavaScript for behaviour. This to-do app reads input, creates elements, handles events and uses an array.</p><p>When you are ready, press <b>Open in Code Lab</b> to turn it into a real project with separate files, then export it as a ZIP.</p>`,
code:D(`  <main>\n    <h1>My To-Do List</h1>\n    <form id="form"><input id="task" placeholder="Add a task" required><button>Add</button></form>\n    <ul id="list"></ul>\n  </main>`,`    const tasks = [];\n    const list = document.querySelector("#list");\n\n    function draw() {\n      list.innerHTML = "";\n      tasks.forEach((t, i) => {\n        const li = document.createElement("li");\n        li.textContent = t;\n        li.onclick = () => { tasks.splice(i, 1); draw(); };\n        list.appendChild(li);\n      });\n    }\n\n    document.querySelector("#form").addEventListener("submit", e => {\n      e.preventDefault();\n      const input = document.querySelector("#task");\n      tasks.push(input.value);\n      input.value = "";\n      draw();\n    });`,`    body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }\n    main { max-width: 420px; margin: auto; }\n    input { padding: 10px; border-radius: 8px; border: 0; width: 70%; }\n    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #38bdf8; font-weight: bold; }\n    li { margin: 8px 0; padding: 10px; background: #1e293b; border-radius: 8px; cursor: pointer; }`),
task:"Click a task to remove it. Then try adding a counter that shows how many tasks are left."}
]}
];
let learn={t:null,l:null},lnLogs=[];
let lnProg={};try{lnProg=JSON.parse(localStorage.getItem("lumen-learn")||"{}")||{}}catch(e){}
const lnKey=(t,l)=>LEARN[t].title+"|"+l;
const lnDone=(t,l)=>!!lnProg[lnKey(t,l)];
function lnHead(title,sub){return`<div class="topline"><div><div class="eyebrow">Lumen learn</div><div class="status">${esc(sub)}</div></div></div><h1>${esc(title)}</h1>`}
function lnRender(){
const app=$("#app");
if(learn.t===null){
app.innerHTML=`${lnHead("Learn to code","Start from zero · HTML · CSS · JavaScript")}<p class="sub">Short lessons with a live playground in every one. Read the idea, change the code, press Run, and see what happens.</p><div class="ln-grid">${LEARN.map((tr,i)=>{const n=tr.lessons.filter((_,j)=>lnDone(i,j)).length;return`<button class="panel ln-card" data-ln="track" data-i="${i}"><span class="eyebrow">${esc(tr.tag)}</span><h2>${esc(tr.title)}</h2><p class="muted">${esc(tr.blurb)}</p><p class="status" style="margin-top:12px">${n}/${tr.lessons.length} lessons complete</p></button>`}).join("")}</div><div class="panel" style="margin-top:18px"><h2>Ready to build something?</h2><p class="muted" style="margin-bottom:14px">Open the Code Lab to create files, preview your work, run many programming languages and export your project as a ZIP.</p><button class="primary" data-view="lab">Open Code Lab</button></div>`
}else if(learn.l===null){
const tr=LEARN[learn.t];
app.innerHTML=`${lnHead(tr.title,tr.lessons.length+" lessons")}<p class="sub">${esc(tr.blurb)}</p><div class="actions" style="margin-bottom:16px"><button class="secondary" data-ln="home">← All courses</button></div><div class="panel">${tr.lessons.map((l,j)=>`<button class="ln-item" data-ln="lesson" data-i="${j}"><span class="ln-num${lnDone(learn.t,j)?" done":""}">${lnDone(learn.t,j)?"✓":j+1}</span><span><b>${esc(l.t)}</b><small>${esc(l.sum)}</small></span></button>`).join("")}</div>`
}else{
const tr=LEARN[learn.t],l=tr.lessons[learn.l],done=lnDone(learn.t,learn.l);
app.innerHTML=`${lnHead(l.t,tr.title+" · Lesson "+(learn.l+1)+" of "+tr.lessons.length)}<div class="actions" style="margin:18px 0 16px"><button class="secondary" data-ln="track" data-i="${learn.t}">← ${esc(tr.title)}</button></div><div class="panel"><div class="ln-body">${l.body}<div class="ln-task"><b>Try it:</b> ${esc(l.task)}</div></div><div class="ln-play"><div><textarea id="lncode" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Lesson code">${esc(l.code)}</textarea><div class="actions" style="margin-top:10px"><button class="primary" data-ln="run">▶ Run</button><button class="secondary" data-ln="reset">Reset code</button><button class="secondary" data-ln="tolab">Open in Code Lab</button></div></div><div><iframe id="lnframe" class="ln-frame" title="Lesson result" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe><div class="ln-out" id="lnout" aria-live="polite"></div></div></div></div><div class="ln-nav"><button class="secondary" data-ln="prev"${learn.l===0?" disabled":""}>← Previous</button><button class="${done?"secondary":"primary"}" data-ln="done">${done?"✓ Completed":"Mark as complete"}</button><button class="secondary" data-ln="next"${learn.l===tr.lessons.length-1?" disabled":""}>Next →</button></div>`;
$("#lncode").addEventListener("keydown",e=>{
if(e.key==="Tab"){e.preventDefault();const ta=e.target;ta.focus();let ok=false;try{ok=document.execCommand("insertText",false,"  ")}catch(_){}if(!ok){ta.setRangeText("  ",ta.selectionStart,ta.selectionEnd,"end")}}
else if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();lnRun()}
});
lnRun()
}
const m=$("#main");if(m)m.scrollTop=0
}
function lnDoc(code){
const shim="<script>"+CL_STORAGE_SHIM+";"+CL_BRIDGE+"<\/script>";
if(/<head\b[^>]*>/i.test(code))return code.replace(/<head\b[^>]*>/i,m=>m+shim);
if(/<html\b[^>]*>/i.test(code))return code.replace(/<html\b[^>]*>/i,m=>m+"<head>"+shim+"</head>");
return"<!doctype html><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">"+shim+code
}
function lnRun(){
const fr=$("#lnframe"),ta=$("#lncode");if(!fr||!ta)return;
lnLogs=[];lnLogsDraw();
fr.srcdoc=lnDoc(ta.value)
}
function lnLogsDraw(){
const el=$("#lnout");if(!el)return;
el.innerHTML=lnLogs.length?lnLogs.map(x=>`<div class="lg lg-${x.level}">${esc(x.text)}</div>`).join(""):`<span class="muted">Console output appears here.</span>`;
el.scrollTop=el.scrollHeight
}
addEventListener("message",e=>{
const fr=document.getElementById("lnframe");
if(!fr||e.source!==fr.contentWindow)return;
const d=e.data||{};
if(d.lumenConsole){
if(d.lumenConsole.level==="clear")lnLogs=[];else{lnLogs.push(d.lumenConsole);if(lnLogs.length>200)lnLogs.shift()}
lnLogsDraw()
}
});
async function lnToLab(){
const ta=$("#lncode");if(!ta)return;
const tr=LEARN[learn.t],l=tr.lessons[learn.l];
if(!clReady)await clLoad();
const np={id:uid(),name:"Lesson: "+l.t,files:[{path:"index.html",content:ta.value}],dirs:[],open:["index.html"],active:"index.html",expanded:{},created:Date.now(),updated:Date.now()};
cl.projects.unshift(np);cl.current=np.id;clPvPath=null;clChanged();
view="lab";render();toast("Opened in Code Lab")
}
document.addEventListener("click",e=>{
const t=e.target.closest("[data-ln]");if(!t||view!=="learn")return;
const a=t.dataset.ln,i=Number(t.dataset.i);
switch(a){
case"home":learn={t:null,l:null};lnRender();break;
case"track":learn={t:i,l:null};lnRender();break;
case"lesson":learn.l=i;lnRender();break;
case"run":lnRun();break;
case"reset":{const l=LEARN[learn.t].lessons[learn.l];$("#lncode").value=l.code;lnRun();break}
case"tolab":lnToLab();break;
case"done":{const k=lnKey(learn.t,learn.l);if(lnProg[k])delete lnProg[k];else lnProg[k]=1;try{localStorage.setItem("lumen-learn",JSON.stringify(lnProg))}catch(_){}lnRender();break}
case"prev":if(learn.l>0){learn.l--;lnRender()}break;
case"next":if(learn.l<LEARN[learn.t].lessons.length-1){learn.l++;lnRender()}break
}
});
document.addEventListener("click",async e=>{
const t=e.target.closest("button,a");
if(!t)return;
if(t.dataset.view){view=t.dataset.view;openProject=null;render();return}
if(t.dataset.tab){await changeTab(t.dataset.tab);return}
if(t.dataset.query){performSearch(t.dataset.query);return}
if(t.dataset.saved!==undefined){
const s=state.saved[Number(t.dataset.saved)];
if(s){query=cleanText(s.title);current=cleanItem({...s});view="search";tab="all";render()}
return
}
if(t.dataset.remove!==undefined){state.saved.splice(Number(t.dataset.remove),1);persist();render();return}
if(t.dataset.project){openProject=t.dataset.project;view="projects";render();return}
if(t.dataset.projectitem!==undefined){
const p=state.projects.find(p=>p.id===openProject);
const item=p?.words[Number(t.dataset.projectitem)];
if(item){query=cleanText(item.title);current=cleanItem({...item});view="search";tab="all";openProject=null;render()}
return
}
if(t.dataset.projectremove!==undefined){state.projects.find(p=>p.id===openProject)?.words.splice(Number(t.dataset.projectremove),1);persist();render();return}
switch(t.dataset.action){
case"clear":clearCurrent();break;
case"retry":performSearch(query);break;
case"retryimages":current.images=[];current.imagesError=false;changeTab("images");break;
case"newproject":showModal(`<h2>New project</h2><input id="projectname" placeholder="Project name"><button class="primary" data-action="createproject">Create project</button>`);break;
case"createproject":createProject(false);break;
case"createandadd":createProject(true);break;
case"newprojectfrommodal":showModal(`<h2>New project</h2><input id="projectname" placeholder="Project name"><button class="primary" data-action="createandadd">Create and add answer</button>`);break;
case"addproject":addCurrentToProject();break;
case"addtoproject":{
const p=state.projects.find(p=>p.id===$("#projectselect").value);
if(p&&current&&!p.words.some(w=>cleanText(w.title)===cleanText(current.title)))p.words.push({title:cleanText(current.title),answer:cleanContent(current.answer),description:cleanText(current.description),hero:current.hero,source:cleanText(current.source),sourceUrl:current.sourceUrl,results:(current.results||[]).map(cleanItem)});
persist();
closeModal();
toast("Added to project");
break
}
case"save":saveCurrent();break;
case"speak":

const canvas=$("#stars"),ctx=canvas.getContext("2d");
let W=0,H=0,stars=[];
const reducedMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
function resize(){
const dpr=Math.min(devicePixelRatio||1,2);
W=canvas.width=Math.round(innerWidth*dpr);
H=canvas.height=Math.round(innerHeight*dpr);
canvas.style.width=innerWidth+"px";
canvas.style.height=innerHeight+"px";
stars=Array.from({length:Math.min(220,Math.floor(innerWidth*innerHeight/7000))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,a:Math.random()*.7+.2,s:Math.random()*.25+.04}))
}
function animate(){
ctx.clearRect(0,0,W,H);
for(const s of stars){
ctx.fillStyle="rgba(220,235,255,"+s.a+")";
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
if(!reducedMotion){s.y-=s.s;if(s.y<0){s.y=H;s.x=Math.random()*W}}
}
if(!reducedMotion)requestAnimationFrame(animate)
}
resize();
animate();
addEventListener("resize",resize);

function stats(t){

function fmtTime(words,wpm){

function renderQuill(app){

  <div class="panel"><div class="eyebrow" style="margin-bottom:10px">Live count</div><div class="qx-stats" id="qxStats"></div></div>

  </div>`;
  const ta=$id("qxText");ta.value=Q.drafts[Q.type]||"";

    const a=b.dataset.qa;if(!a)return;

    }
  };

function qUpdate(){
  const T=TYPES[Q.type],t=Q.drafts[Q.type]||"",s=stats(t);
  const items=[["Words",s.words],["Sentences",s.sentences],["Paragraphs",s.paragraphs],["Lines",s.lines],["Characters",s.chars],["No spaces",s.nospace],["Read time",fmtTime(s.words,200)],["Speak time",fmtTime(s.words,130)],["Words / sentence",s.avg]];
  $id("qxStats").innerHTML=items.map(([k,v])=>`<div class="qx-stat"><b>${E(v)}</b><span>${E(k)}</span></div>`).join("");
  const bar=$id("qxBar"),g=$id("qxGoal");
  bar.style.width=Math.min(100,s.words/T.max*100)+"%";
  $id("qxMin").style.left=(T.min/T.max*100)+"%";
  bar.className=s.words===0?"":s.words<T.min?"low":s.words<=T.max?"ok":"high";
  g.textContent=s.words===0?`Suggested length: ${T.min}–${T.max} words`:s.words<T.min?`${T.min-s.words} more words to reach the suggested ${T.min}–${T.max}`:s.words<=T.max?`Great. You are in the suggested ${T.min}–${T.max} range`:`${s.words-T.max} words over the suggested ${T.min}–${T.max}`;
  $id("qxCheck").innerHTML=T.checks.map(([l,f])=>{let ok=false;try{ok=!!f(t)}catch(e){}return`<li class="${ok?"ok":""}"><span>${ok?"✓":"○"}</span>${E(l)}</li>`}).join("");
}

  </div>`;

    const id=e.target.id;
    if(id==="cxName"){C.name=e.target.value;cSave()}
    else if(id==="cxContact"){C.contact=e.target.value;cSave()}

    else if(id==="cxSev")C.sev=e.target.value;
    else if(id==="cxDev")C.device=e.target.checked;
    else return;
    prev();

    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.cxcat){C.cat=b.dataset.cxcat;renderConnect(app);return}
    if(b.dataset.cxstar){C.rating=+b.dataset.cxstar;$id("cxExtra").innerHTML=extraFields();prev();return}
    if(b.dataset.cxmood){C.mood=b.dataset.cxmood;$id("cxExtra").innerHTML=extraFields();prev();return}

      if(C.msg.trim().length<5)return say("Write your message first");
      copyText(buildMsg()).then(()=>say("Message copied")).catch(()=>say("Could not copy"));
    }else if(a==="open"){
      if(!window.open("https://wa.me/"+WA_NUM,"_blank"))location.href="https://wa.me/"+WA_NUM;
    }else if(a==="copynum"){
      copyText("+"+WA_NUM).then(()=>say("Number copied")).catch(()=>say("Could not copy"));

      saved.hist=[];cSave();$id("cxHist").innerHTML=histHTML();

/* ---------------- hook into the app's render ---------------- */
const _render=render;
render=function(){
  const app=$id("app");
  app.onclick=app.oninput=app.onchange=null;
  if(MV.includes(view)){
    clTeardown();document.body.classList.remove("labmode");
    document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("on",b.dataset.view===view));
    view==="connect"?renderConnect(app):renderQuill(app);
    $id("main").scrollTop=0;
    return;
  }
  _render();
};
})();

<script>
let deferredPrompt = null;
const btn = document.getElementById('installBtn');
const help = document.getElementById('installHelp');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  console.log('Chrome prompt ready');
});

btn.addEventListener('click', async () => {
  if (deferredPrompt) {

    // Fallback when Chrome blocks the popup
    help.style.display = 'block';
  }
});

// Hide if already installed
if (window.matchMedia('(display-mode: standalone)').matches) {
  btn.style.display = 'none';
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
